<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/storefront :: head('Theo dõi phiếu bảo hành')}"></head><body class="storefront-body"><nav th:replace="~{fragments/storefront :: nav}"></nav><main class="container py-4 warranty-shell"><div class="warranty-public mx-auto"><h1 class="h2">Theo dõi phiếu bảo hành</h1><p class="text-secondary">Nhập mã phiếu trên biên nhận và Serial của sản phẩm.</p><form th:action="@{/warranty/track}" method="post" class="card card-body gap-3 mb-4"><label for="ticketCode" class="form-label mb-0">Mã phiếu</label><input id="ticketCode" name="ticketCode" class="form-control" maxlength="40" required autocomplete="off" placeholder="BH-…"><label for="serialNo" class="form-label mb-0">Serial / IMEI</label><input id="serialNo" name="serialNo" class="form-control" maxlength="30" required autocomplete="off"><button class="btn btn-primary">Theo dõi phiếu</button></form><div th:if="${searched==true and result==null}" class="alert alert-info">Không tìm thấy phiếu bảo hành khớp với thông tin đã nhập.</div><section th:if="${result!=null}" class="card card-body"><h2 class="h5">Tiến độ bảo hành</h2><div><span th:replace="~{fragments/warranty :: status(${result.status})}"></span></div><div th:replace="~{fragments/warranty :: timeline(${result.timeline})}"></div></section><a th:href="@{/warranty}" class="d-inline-block mt-4">← Tra cứu thời hạn bảo hành</a></div></main><footer th:replace="~{fragments/storefront :: footer}"></footer></body></html>
