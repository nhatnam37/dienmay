<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/storefront :: head('Tra cứu bảo hành')}"></head><body class="storefront-body"><nav th:replace="~{fragments/storefront :: nav}"></nav><main class="container py-4 warranty-shell"><div class="warranty-public mx-auto"><h1 class="h2">Tra cứu bảo hành</h1><p class="text-secondary">Kiểm tra thời hạn bảo hành và tình trạng sửa chữa của sản phẩm.</p>
<form th:action="@{/warranty}" method="post" class="card card-body gap-3 mb-4"><label for="serialNo" class="form-label mb-0">Serial / IMEI</label><input id="serialNo" name="serialNo" class="form-control" maxlength="30" required autocomplete="off" placeholder="Nhập Serial hoặc IMEI"><button class="btn btn-primary" type="submit">Tra cứu bảo hành</button></form>
<div id="warranty-result" aria-live="polite"><div th:if="${searched==true and result==null}" class="alert alert-info" th:text="${notFoundMessage}"></div>
<section th:if="${result!=null}" class="card card-body"><h2 class="h4" th:text="${result.productName}"></h2><dl class="row mt-3"><dt class="col-sm-5">Ngày bắt đầu</dt><dd class="col-sm-7" th:text="${#temporals.format(result.startDate,'dd/MM/yyyy')}"></dd><dt class="col-sm-5">Ngày hết hạn</dt><dd class="col-sm-7" th:text="${#temporals.format(result.endDate,'dd/MM/yyyy')}"></dd></dl><div><span th:replace="~{fragments/warranty :: coverage(${result.valid},${result.daysRemaining})}"></span></div><div class="mt-3" th:if="${result.repairStatus!=null}">Tình trạng sửa chữa: <span th:replace="~{fragments/warranty :: status(${result.repairStatus})}"></span></div></section></div><a th:href="@{/warranty/track}" class="d-inline-block mt-4">Theo dõi phiếu bảo hành →</a></div></main><footer th:replace="~{fragments/storefront :: footer}"></footer></body></html>
