<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Biên nhận bảo hành')}"></head><body class="warranty-staff"><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container py-4 warranty-shell"><div class="no-print d-flex gap-3 mb-4"><button class="btn btn-primary" type="button" data-warranty-print>In biên nhận</button><a class="btn btn-outline-secondary" th:href="@{/staff/warranty/tickets/{id}(id=${screen.ticket.id})}">Quay lại phiếu</a></div><article class="card card-body invoice-paper warranty-receipt"><h1 class="h3 text-center mb-4">BIÊN NHẬN BẢO HÀNH</h1><dl class="row"><dt class="col-4">Mã phiếu</dt><dd class="col-8" th:text="${screen.ticket.code}"></dd><dt class="col-4">Chi nhánh tiếp nhận</dt><dd class="col-8" th:text="${screen.branchName}"></dd><dt class="col-4">Ngày nhận</dt><dd class="col-8" th:text="${#temporals.format(screen.ticket.receivedAt,'dd/MM/yyyy HH:mm')}"></dd><dt class="col-4">Sản phẩm</dt><dd class="col-8" th:text="${screen.productName}"></dd><dt class="col-4">Serial / IMEI</dt><dd class="col-8" th:text="${screen.ticket.serialNo}"></dd><dt class="col-4">Mô tả lỗi</dt><dd class="col-8 preserve-lines" th:text="${screen.ticket.issueDescription}"></dd></dl><p class="small text-secondary">Vui lòng giữ biên nhận và cung cấp mã phiếu cùng Serial khi tra cứu tiến độ.</p><div class="row text-center warranty-signatures"><div class="col-6">Người tiếp nhận</div><div class="col-6">Khách hàng</div></div></article></main><script th:src="@{/js/warranty.js}" defer></script></body></html>
