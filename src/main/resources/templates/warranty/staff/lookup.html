<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Tra cứu bảo hành')}"></head><body class="warranty-staff"><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container py-4 warranty-shell"><div th:replace="~{fragments/layout :: messages}"></div><div class="d-flex flex-wrap justify-content-between gap-3 mb-4"><h1 class="h3">Tra cứu bảo hành</h1><a class="btn btn-outline-primary" th:href="@{/staff/warranty/tickets}">Danh sách phiếu</a></div><form th:action="@{/staff/warranty/lookup}" method="post" class="card card-body mb-4"><div class="row g-3"><div class="col-md-5"><label for="serialNo" class="form-label">Serial / IMEI</label><input id="serialNo" name="serialNo" class="form-control" maxlength="30"></div><div class="col-md-5"><label for="phone" class="form-label">Hoặc số điện thoại</label><input id="phone" name="phone" type="tel" class="form-control" maxlength="20"></div><div class="col-md-2 align-self-end"><button class="btn btn-primary">Tra cứu</button></div></div><small class="text-secondary mt-2">Chỉ đọc xuyên chi nhánh. Nếu nhập cả hai, ưu tiên Serial.</small></form><p th:if="${searched==true and results.empty}">Không tìm thấy hồ sơ phù hợp.</p><article th:each="row : ${results}" class="card card-body mb-4"><h2 class="h5" th:text="${row.warranty.productName+' · '+row.warranty.serialNo}"></h2><p><span th:text="${row.warranty.customerName ?: 'Khách hàng'}"></span> · <span th:text="${row.warranty.customerPhone}"></span> · <a th:href="@{/staff/warranty/invoices/{id}(id=${row.warranty.invoiceId})}" th:text="${row.warranty.invoiceCode}"></a></p><p th:text="${#temporals.format(row.warranty.startDate,'dd/MM/yyyy')+' – '+#temporals.format(row.warranty.endDate,'dd/MM/yyyy')}"></p><div><th:block th:if="${row.warranty.warrantyStatus=='ACTIVE'}"><span th:replace="~{fragments/warranty :: coverage(${row.valid},${row.daysRemaining})}"></span></th:block><span th:if="${row.warranty.warrantyStatus=='VOIDED'}" class="badge text-bg-secondary">Hồ sơ đã vô hiệu</span></div><a th:if="${row.canReceive}" class="btn btn-primary align-self-start mt-3" th:href="@{/staff/warranty/tickets/new(serialNo=${row.warranty.serialNo})}">Tiếp nhận bảo hành</a><p class="text-warning mt-3" th:if="${!row.valid and row.warranty.warrantyStatus=='ACTIVE'}" sec:authorize="hasRole('WARRANTY_STAFF')">Hết hạn bảo hành: cần nhờ quản lý tiếp nhận.</p><details th:each="ticket : ${row.warranty.tickets}" class="mt-3"><summary><span th:text="${ticket.detail.code}"></span> · <span th:replace="~{fragments/warranty :: status(${ticket.detail.status})}"></span></summary><a class="d-inline-block my-2" th:if="${#authorization.expression('hasRole(''ADMIN'')') or ticket.detail.branchId==#authentication.principal.branchId}" th:href="@{/staff/warranty/tickets/{id}(id=${ticket.detail.id})}">Mở phiếu</a><div th:replace="~{fragments/warranty :: staffTimeline(${ticket.history})}"></div></details></article></main></body></html>
