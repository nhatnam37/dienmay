<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Tiếp nhận bảo hành')}"></head><body class="warranty-staff"><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container py-4 warranty-shell"><div th:replace="~{fragments/layout :: messages}"></div><h1 class="h3">Tiếp nhận bảo hành</h1><form th:action="@{/staff/warranty/tickets/new}" method="get" class="card card-body mb-4 form-width-wide"><label for="previewSerial" class="form-label">Serial / IMEI cần tiếp nhận</label><div class="d-flex gap-2"><input id="previewSerial" class="form-control" name="serialNo" th:value="${receiveForm.serialNo}" maxlength="30" required><button class="btn btn-outline-primary text-nowrap">Kiểm tra điều kiện</button></div></form><section th:if="${intake!=null}" class="form-width-wide"><div class="card card-body mb-3"><h2 class="h5" th:text="${intake.productName}"></h2><p>Serial: <strong th:text="${intake.serialNo}"></strong></p><p>Hạn bảo hành: <span th:text="${#temporals.format(intake.endDate,'dd/MM/yyyy')}"></span></p><div><span th:replace="~{fragments/warranty :: coverage(${intake.valid},${intake.daysRemaining})}"></span></div></div><div th:if="${!intake.valid and !intake.canOverride}" class="alert alert-warning">Sản phẩm đã hết hạn bảo hành. Vui lòng nhờ quản lý tiếp nhận.</div><div th:if="${!intake.canReceive and (intake.valid or intake.canOverride)}" class="alert alert-warning">Chưa thể tiếp nhận: máy chưa ở trạng thái đã bán hoặc đã có phiếu bảo hành đang mở.</div><form th:if="${intake.canReceive}" th:action="@{/staff/warranty/tickets}" method="post" th:object="${receiveForm}" class="card card-body gap-3"><input type="hidden" th:field="*{serialNo}"><input type="hidden" th:field="*{warrantyId}"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger"><p th:each="error : ${#fields.globalErrors()}" th:text="${error}" class="mb-0"></p></div><label for="issueDescription" class="form-label mb-0">Mô tả lỗi</label><textarea id="issueDescription" th:field="*{issueDescription}" class="form-control" rows="4" maxlength="1000" required></textarea><div class="text-danger small" th:errors="*{issueDescription}"></div><th:block th:if="${!intake.valid and intake.canOverride}"><label for="overrideReason" class="form-label mb-0">Lý do nhận ngoài bảo hành</label><textarea id="overrideReason" th:field="*{overrideReason}" class="form-control" rows="3" maxlength="1000" required></textarea><div class="text-danger small" th:errors="*{overrideReason}"></div></th:block><button class="btn btn-primary">Tiếp nhận bảo hành</button></form></section><a class="d-inline-block mt-3" th:href="@{/staff/warranty/tickets}">← Danh sách phiếu</a></main></body></html>
