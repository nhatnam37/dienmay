<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Phiếu bảo hành')}"></head><body class="warranty-staff"><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container py-4 warranty-shell"><div th:replace="~{fragments/layout :: messages}"></div><div class="d-flex flex-wrap justify-content-between gap-3 mb-3"><div><h1 class="h3">Phiếu bảo hành</h1><p class="text-secondary">Ưu tiên phiếu đang mở lâu nhất.</p></div><div class="d-flex gap-2 align-items-start"><a class="btn btn-outline-primary" th:href="@{/staff/warranty/lookup}">Tra cứu</a><a class="btn btn-primary" th:href="@{/staff/warranty/tickets/new}">Tiếp nhận bảo hành</a></div></div><form th:action="@{/staff/warranty/tickets}" method="get" class="card card-body mb-4"><div class="row g-3"><div class="col-md-3" sec:authorize="hasRole('ADMIN')"><label for="branchId" class="form-label">Chi nhánh</label><select id="branchId" name="branchId" class="form-select"><option value="">Tất cả chi nhánh</option><option th:each="branch : ${branches}" th:value="${branch.id}" th:text="${branch.name}" th:selected="${branch.id==branchId}"></option></select></div><div class="col-md-3"><label for="status" class="form-label">Trạng thái</label><select id="status" name="status" class="form-select"><option value="">Tất cả</option><option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s==status}"></option></select></div><div class="col-md-3"><label for="from" class="form-label">Từ ngày</label><input id="from" name="from" type="date" class="form-control" th:value="${from}"></div><div class="col-md-3"><label for="to" class="form-label">Đến ngày</label><input id="to" name="to" type="date" class="form-control" th:value="${to}"></div><div class="col-md-3"><label for="code" class="form-label">Mã phiếu</label><input id="code" name="code" class="form-control" th:value="${code}" maxlength="40"></div><div class="col-md-3"><label for="serialNo" class="form-label">Serial / IMEI</label><input id="serialNo" name="serialNo" class="form-control" th:value="${serialNo}" maxlength="30"></div><div class="col-md-3"><label for="phone" class="form-label">Số điện thoại</label><input id="phone" name="phone" type="tel" class="form-control" th:value="${phone}" maxlength="20"></div><div class="col-md-3 align-self-end"><button class="btn btn-primary">Lọc</button></div></div></form><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Mã phiếu</th><th>Sản phẩm / Serial</th><th>Chi nhánh</th><th>Ngày nhận</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="ticket : ${result.content}"><td><a th:href="@{/staff/warranty/tickets/{id}(id=${ticket.id})}" th:text="${ticket.code}"></a></td><td><strong th:text="${ticket.productName}"></strong><br><span th:text="${ticket.serialNo}"></span></td><td th:text="${ticket.branchName}"></td><td th:text="${#temporals.format(ticket.receivedAt,'dd/MM/yyyy HH:mm')}"></td><td><span th:replace="~{fragments/warranty :: status(${ticket.status})}"></span></td></tr><tr th:if="${result.empty}"><td colspan="5" class="text-center text-secondary py-4">Không có phiếu phù hợp.</td></tr></tbody></table></div><nav th:if="${result.totalPages>1}" aria-label="Phân trang phiếu" class="d-flex align-items-center gap-3"><a th:if="${result.hasPrevious()}" th:href="@{/staff/warranty/tickets(page=${result.number-1},branchId=${branchId},status=${status},code=${code},serialNo=${serialNo},phone=${phone},from=${from},to=${to})}">Trước</a><span th:text="${(result.number+1)+' / '+result.totalPages}"></span><a th:if="${result.hasNext()}" th:href="@{/staff/warranty/tickets(page=${result.number+1},branchId=${branchId},status=${status},code=${code},serialNo=${serialNo},phone=${phone},from=${from},to=${to})}">Sau</a></nav></main></body></html>
