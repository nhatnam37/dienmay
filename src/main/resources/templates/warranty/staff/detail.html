<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Chi tiết phiếu bảo hành')}"></head><body class="warranty-staff"><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container py-4 warranty-shell"><div th:replace="~{fragments/layout :: messages}"></div><div class="d-flex flex-wrap justify-content-between gap-3 mb-4"><div><h1 class="h3" th:text="${screen.ticket.code}"></h1><span th:replace="~{fragments/warranty :: status(${screen.ticket.status})}"></span></div><div><a class="btn btn-outline-primary" th:href="@{/staff/warranty/tickets/{id}/print(id=${screen.ticket.id})}">In biên nhận</a><a class="btn btn-outline-secondary" th:href="@{/staff/warranty/tickets}">Danh sách</a></div></div><div class="row g-4"><section class="col-lg-7"><div class="card card-body"><h2 class="h5" th:text="${screen.productName}"></h2><dl class="row mb-0"><dt class="col-sm-4">Serial</dt><dd class="col-sm-8" th:text="${screen.ticket.serialNo}"></dd><dt class="col-sm-4">Chi nhánh tiếp nhận</dt><dd class="col-sm-8" th:text="${screen.branchName}"></dd><dt class="col-sm-4">Khách hàng</dt><dd class="col-sm-8" th:text="${(screen.customerName ?: 'Khách hàng')+' · '+screen.customerPhone}"></dd><dt class="col-sm-4">Hóa đơn gốc</dt><dd class="col-sm-8"><a th:href="@{/staff/warranty/invoices/{id}(id=${screen.invoiceId})}">Xem hóa đơn</a></dd><dt class="col-sm-4">Mô tả lỗi</dt><dd class="col-sm-8 preserve-lines" th:text="${screen.ticket.issueDescription}"></dd><th:block th:if="${screen.ticket.outOfWarranty}"><dt class="col-sm-4">Ngoài bảo hành</dt><dd class="col-sm-8 preserve-lines" th:text="${screen.ticket.overrideReason}"></dd></th:block><th:block th:if="${screen.ticket.diagnosis!=null}"><dt class="col-sm-4">Chẩn đoán</dt><dd class="col-sm-8 preserve-lines" th:text="${screen.ticket.diagnosis}"></dd><dt class="col-sm-4">Kết quả</dt><dd class="col-sm-8 preserve-lines" th:text="${screen.ticket.resolution}"></dd></th:block><th:block th:if="${screen.ticket.rejectReason!=null}"><dt class="col-sm-4">Lý do từ chối</dt><dd class="col-sm-8 preserve-lines" th:text="${screen.ticket.rejectReason}"></dd></th:block></dl></div><section class="card card-body mt-4"><h2 class="h5">Dòng thời gian</h2><div th:replace="~{fragments/warranty :: staffTimeline(${screen.history})}"></div></section></section><section class="col-lg-5"><h2 class="h5">Thao tác</h2>
<form th:if="${screen.ticket.status.name()=='RECEIVED'}" th:action="@{/staff/warranty/tickets/{id}/transition(id=${screen.ticket.id})}" method="post" class="card card-body mb-3" data-confirm="Bắt đầu sửa sản phẩm này?"><input type="hidden" name="version" th:value="${screen.ticket.version}"><input type="hidden" name="target" value="IN_REPAIR"><button class="btn btn-primary">Bắt đầu sửa</button></form>
<form th:if="${screen.ticket.status.name()=='IN_REPAIR'}" th:action="@{/staff/warranty/tickets/{id}/transition(id=${screen.ticket.id})}" method="post" class="card card-body gap-3 mb-3" data-confirm="Xác nhận đã sửa xong?"><input type="hidden" name="version" th:value="${screen.ticket.version}"><input type="hidden" name="target" value="COMPLETED"><label for="diagnosis" class="form-label mb-0">Chẩn đoán</label><textarea id="diagnosis" name="diagnosis" class="form-control" rows="3" maxlength="1000" required></textarea><label for="resolution" class="form-label mb-0">Kết quả sửa chữa</label><textarea id="resolution" name="resolution" class="form-control" rows="3" maxlength="1000" required></textarea><button class="btn btn-success">Hoàn tất sửa chữa</button></form>
<form th:if="${screen.ticket.status.name()=='RECEIVED' or screen.ticket.status.name()=='IN_REPAIR'}" th:action="@{/staff/warranty/tickets/{id}/transition(id=${screen.ticket.id})}" method="post" class="card card-body gap-3 mb-3" data-confirm="Xác nhận từ chối bảo hành?"><input type="hidden" name="version" th:value="${screen.ticket.version}"><input type="hidden" name="target" value="REJECTED"><label for="rejectReason" class="form-label mb-0">Lý do từ chối</label><textarea id="rejectReason" name="reason" class="form-control" maxlength="1000" required></textarea><button class="btn btn-outline-danger">Từ chối bảo hành</button></form>
<form th:if="${screen.ticket.status.name()=='COMPLETED' or screen.ticket.status.name()=='REJECTED'}" th:action="@{/staff/warranty/tickets/{id}/transition(id=${screen.ticket.id})}" method="post" class="card card-body mb-3" data-confirm="Xác nhận đã giao sản phẩm lại cho khách?"><input type="hidden" name="version" th:value="${screen.ticket.version}"><input type="hidden" name="target" value="RETURNED"><button class="btn btn-success">Trả khách</button></form>
<form th:if="${screen.ticket.status.name()=='RECEIVED'}" th:action="@{/staff/warranty/tickets/{id}/transition(id=${screen.ticket.id})}" method="post" class="card card-body gap-3 mb-3" data-confirm="Xác nhận hủy phiếu bảo hành?"><input type="hidden" name="version" th:value="${screen.ticket.version}"><input type="hidden" name="target" value="CANCELLED"><label for="cancelReason" class="form-label mb-0">Lý do hủy</label><textarea id="cancelReason" name="reason" class="form-control" maxlength="1000" required></textarea><button class="btn btn-outline-danger">Hủy phiếu</button></form><p th:if="${!screen.ticket.status.open}" class="alert alert-secondary">Phiếu đã đóng, không còn thao tác cập nhật.</p></section></div></main><script th:src="@{/js/warranty.js}" defer></script></body></html>
