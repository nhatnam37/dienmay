<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Hóa đơn bảo hành')}"></head><body class="warranty-staff"><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container py-4 warranty-shell"><div th:replace="~{fragments/layout :: messages}"></div><h1 class="h3" th:text="${invoice.code}"></h1><p class="text-secondary">Thông tin hóa đơn gốc phục vụ đối chiếu bảo hành · Chỉ đọc</p><p>Chi nhánh: <strong th:text="${invoice.branchName}"></strong> · Ngày bán: <span th:text="${#temporals.format(invoice.createdAt,'dd/MM/yyyy HH:mm')}"></span></p><p>Khách hàng: <span th:text="${invoice.customerName}"></span> · <span th:text="${invoice.customerPhone}"></span></p><div class="table-responsive"><table class="table"><thead><tr><th>Sản phẩm / Serial</th><th>Số lượng</th><th>Đơn giá</th><th>Thành tiền</th></tr></thead><tbody><tr th:each="line : ${invoice.lines}"><td><span th:text="${line.productName}"></span><br><span th:text="${line.serialNo}"></span></td><td th:text="${line.quantity}"></td><td th:text="${#numbers.formatDecimal(line.price,1,'POINT',0,'COMMA')+' đ'}"></td><td th:text="${#numbers.formatDecimal(line.total,1,'POINT',0,'COMMA')+' đ'}"></td></tr></tbody></table></div><p class="h5">Tổng hóa đơn: <span th:text="${#numbers.formatDecimal(invoice.total,1,'POINT',0,'COMMA')+' đ'}"></span></p><a th:href="@{/staff/warranty/lookup}">← Tra cứu bảo hành</a></main></body></html>
