<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/storefront :: head('Bảo hành của tôi')}"></head><body class="storefront-body"><nav th:replace="~{fragments/storefront :: nav}"></nav><main class="container py-4 warranty-shell"><h1 class="h3">Bảo hành của tôi</h1><p class="text-secondary">Máy mua tại cửa hàng vui lòng tra cứu bằng Serial ở trang <a th:href="@{/warranty}">Tra cứu bảo hành</a>.</p><div class="alert alert-info" th:if="${profiles.empty}">Bạn chưa có hồ sơ bảo hành từ đơn hàng online.</div><article class="card card-body mb-4" th:each="profile : ${profiles}"><h2 class="h5" th:text="${profile.warranty.productName}"></h2><p>Serial: <strong th:text="${profile.warranty.serialNo}"></strong> · Hóa đơn: <span th:text="${profile.warranty.invoiceCode}"></span></p><p th:text="${#temporals.format(profile.warranty.startDate,'dd/MM/yyyy')+' – '+#temporals.format(profile.warranty.endDate,'dd/MM/yyyy')}"></p><div><th:block th:if="${profile.warranty.status=='ACTIVE'}"><span th:replace="~{fragments/warranty :: coverage(${profile.warranty.valid},${profile.warranty.daysRemaining})}"></span></th:block><span th:if="${profile.warranty.status=='VOIDED'}" class="badge text-bg-secondary">Hồ sơ đã vô hiệu</span></div><details class="mt-3" th:each="ticket : ${profile.tickets}" open><summary><span th:text="${ticket.code}"></span> · <span th:replace="~{fragments/warranty :: status(${ticket.tracking.status})}"></span></summary><div th:replace="~{fragments/warranty :: timeline(${ticket.tracking.timeline})}"></div></details><p th:if="${profile.tickets.empty}" class="small text-secondary mt-3 mb-0">Chưa có phiếu bảo hành.</p></article></main><footer th:replace="~{fragments/storefront :: footer}"></footer></body></html>
