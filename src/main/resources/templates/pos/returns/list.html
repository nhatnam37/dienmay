<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Phiếu trả hàng')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container pb-5"><h1 class="h3">Phiếu trả hàng</h1><form method="get" th:action="@{/pos/returns}" class="d-flex gap-2 mb-3" sec:authorize="hasRole('ADMIN')"><label for="branchId" class="form-label">Chi nhánh</label><select class="form-select form-width-medium" id="branchId" name="branchId"><option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}" th:selected="${b.id == branchId}"></option></select><button class="btn btn-primary">Lọc</button></form><div class="table-responsive"><table class="table table-striped"><thead><tr><th>Mã phiếu</th><th>Hóa đơn</th><th>Loại</th><th>Ngày</th><th class="text-end">Tổng hoàn</th></tr></thead><tbody><tr th:each="r : ${page.content}"><td><a th:href="@{/pos/returns/{id}(id=${r.id})}" th:text="${r.code}"></a></td><td th:text="${r.invoiceCode}"></td><td th:text="${r.type.name() == 'FULL_CANCEL' ? 'Hủy hóa đơn' : 'Trả hàng'}"></td><td th:text="${#temporals.format(r.createdAt,'dd/MM/yyyy HH:mm')}"></td><td class="text-end" th:text="${#numbers.formatDecimal(r.refundTotal,1,'POINT',0,'COMMA')+' đ'}"></td></tr><tr th:if="${page.empty}"><td colspan="5">Chưa có phiếu trả hàng.</td></tr></tbody></table></div><nav class="d-flex gap-3" th:if="${page.totalPages>1}"><a th:if="${page.hasPrevious()}" th:href="@{/pos/returns(page=${page.number-1},branchId=${branchId})}">Trước</a><span th:text="${(page.number+1)+' / '+page.totalPages}"></span><a th:if="${page.hasNext()}" th:href="@{/pos/returns(page=${page.number+1},branchId=${branchId})}">Sau</a></nav></main></body></html>
