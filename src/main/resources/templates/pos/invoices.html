<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Danh sách hóa đơn')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container pb-5"><div class="d-flex justify-content-between mb-3"><h1 class="h3">Danh sách hóa đơn</h1><a class="btn btn-primary" th:href="@{/pos}">Bán đơn mới</a></div><div th:replace="~{fragments/layout :: messages}"></div>
<p sec:authorize="hasRole('CASHIER')" class="text-secondary">Bạn chỉ xem được hóa đơn do mình lập trong ngày hôm nay.</p>
<form method="get" th:action="@{/pos/invoices}" class="card card-body mb-3"><div class="row g-2"><div class="col-md-3" sec:authorize="hasRole('ADMIN')"><label class="form-label" for="branchId">Chi nhánh</label><select name="branchId" id="branchId" class="form-select"><option value="">Tất cả chi nhánh</option><option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}" th:selected="${b.id == branchId}"></option></select></div><th:block sec:authorize="!hasRole('CASHIER')"><div class="col-md-2"><label class="form-label" for="from">Từ ngày</label><input class="form-control" type="date" id="from" name="from" th:value="${from}"></div><div class="col-md-2"><label class="form-label" for="to">Đến ngày</label><input class="form-control" type="date" id="to" name="to" th:value="${to}"></div></th:block><div class="col-md-2"><label class="form-label" for="code">Mã hóa đơn</label><input class="form-control" id="code" name="code" maxlength="50" th:value="${code}"></div><div class="col-md-2"><label class="form-label" for="phone">Số điện thoại</label><input class="form-control" id="phone" name="phone" maxlength="20" th:value="${phone}"></div><div class="col-md-2"><label class="form-label" for="status">Trạng thái</label><select class="form-select" name="status" id="status"><option value="">Tất cả</option><option value="COMPLETED" th:selected="${filterStatus != null and filterStatus.name() == 'COMPLETED'}">Hoàn tất</option><option value="CANCELLED" th:selected="${filterStatus != null and filterStatus.name() == 'CANCELLED'}">Đã hủy</option></select></div><div class="col-auto align-self-end"><button class="btn btn-primary">Lọc</button></div></div></form>
<div class="table-responsive"><table class="table table-striped align-middle"><thead><tr><th>Mã hóa đơn</th><th>Chi nhánh / Thu ngân</th><th>Ngày giờ</th><th>Khách hàng</th><th class="text-end">Tổng tiền</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="i : ${page.content}"><td><a th:href="@{/pos/invoices/{id}(id=${i.id})}" th:text="${i.code}"></a></td><td><div th:text="${i.branchName}"></div><small th:text="${i.cashierName}"></small></td><td th:text="${#temporals.format(i.createdAt,'dd/MM/yyyy HH:mm')}"></td><td><div th:text="${i.customerName ?: 'Khách lẻ'}"></div><small th:text="${i.customerPhone}"></small></td><td class="text-end" th:text="${#numbers.formatDecimal(i.totalAmount,1,'POINT',i.totalAmount.stripTrailingZeros().scale() > 0 ? 2 : 0,'COMMA') + ' đ'}"></td><td><span th:replace="~{fragments/status :: invoiceState(${i.status},${returnLabels.get(i.id)})}"></span></td></tr><tr th:if="${page.empty}"><td colspan="6" class="text-center text-secondary py-4">Không có hóa đơn phù hợp.</td></tr></tbody></table></div>
<nav th:if="${page.totalPages > 1}" aria-label="Phân trang"><ul class="pagination"><li class="page-item" th:classappend="${page.first ? 'disabled' : ''}"><a class="page-link" th:href="@{/pos/invoices(page=${page.number - 1},branchId=${branchId},from=${from},to=${to},code=${code},phone=${phone},status=${filterStatus})}">Trước</a></li><li class="page-item disabled"><span class="page-link" th:text="${(page.number + 1) + ' / ' + page.totalPages}"></span></li><li class="page-item" th:classappend="${page.last ? 'disabled' : ''}"><a class="page-link" th:href="@{/pos/invoices(page=${page.number + 1},branchId=${branchId},from=${from},to=${to},code=${code},phone=${phone},status=${filterStatus})}">Sau</a></li></ul></nav>
</main></body></html>
