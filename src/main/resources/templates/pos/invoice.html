<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Hóa đơn bán hàng')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container pb-5" id="invoice-page" th:attr="data-completed-token=${completedToken},data-owner=${storageOwner}" th:with="i=${detail.invoice}">
<div class="d-flex gap-2 mb-4 no-print"><button id="print-invoice" type="button" class="btn btn-primary">In hóa đơn</button><a class="btn btn-success" th:href="@{/pos}">Bán đơn mới</a><a class="btn btn-outline-secondary" th:href="@{/pos/invoices}">Danh sách hóa đơn</a></div>
<a th:if="${returnScreen != null and (returnScreen.canCancel or returnScreen.canReturn)}" class="btn btn-warning no-print mb-3" th:href="@{/pos/invoices/{id}/returns/new(id=${i.id})}">Đổi trả / Hủy</a>
<article class="invoice-paper card card-body"><header class="text-center mb-3"><h1 class="h3">HÓA ĐƠN BÁN HÀNG</h1><h2 class="h5" th:text="${i.branchName}"></h2><strong th:text="${i.code}"></strong> <span th:replace="~{fragments/status :: invoiceState(${i.status},${returnLabels.get(i.id)})}"></span></header>
<div class="row mb-3"><div class="col-sm-6">Thu ngân: <span th:text="${i.cashierName}"></span><br>Ngày giờ: <span th:text="${#temporals.format(i.createdAt,'dd/MM/yyyy HH:mm')}"></span></div><div class="col-sm-6">Khách hàng: <span th:text="${i.customerName ?: 'Khách lẻ'}"></span><br>Số điện thoại: <span th:text="${i.customerPhone ?: '—'}"></span></div></div>
<div class="table-responsive"><table class="table"><thead><tr><th>Sản phẩm / Serial</th><th>SL</th><th class="text-end">Đơn giá</th><th class="text-end">Thành tiền</th></tr></thead><tbody><tr th:each="line : ${i.items}"><td><strong th:text="${line.productName}"></strong><div class="small" th:text="${line.sku}"></div><div th:if="${line.serialNo}" class="small">Serial: <span th:text="${line.serialNo}"></span></div><div th:if="${detail.warrantyEnds.containsKey(line.id)}" class="small">Bảo hành đến: <span th:text="${#temporals.format(detail.warrantyEnds.get(line.id),'dd/MM/yyyy')}"></span> <strong th:if="${detail.voidedWarranties.contains(line.id)}" class="text-danger">(Đã hủy bảo hành)</strong></div></td><td th:text="${line.quantity}"></td><td class="text-end" th:text="${#numbers.formatDecimal(line.unitPrice,1,'POINT',line.unitPrice.stripTrailingZeros().scale() > 0 ? 2 : 0,'COMMA') + ' đ'}"></td><td class="text-end" th:text="${#numbers.formatDecimal(line.lineTotal,1,'POINT',line.lineTotal.stripTrailingZeros().scale() > 0 ? 2 : 0,'COMMA') + ' đ'}"></td></tr></tbody></table></div>
<div class="invoice-totals ms-auto"><div class="d-flex justify-content-between gap-4"><span>Tiền hàng</span><span th:text="${#numbers.formatDecimal(i.subtotal,1,'POINT',i.subtotal.stripTrailingZeros().scale() > 0 ? 2 : 0,'COMMA') + ' đ'}"></span></div><div class="d-flex justify-content-between gap-4"><span>Giảm giá</span><span th:text="${#numbers.formatDecimal(i.discountAmount,1,'POINT',i.discountAmount.stripTrailingZeros().scale() > 0 ? 2 : 0,'COMMA') + ' đ'}"></span></div><div class="d-flex justify-content-between gap-4 fw-bold fs-5"><span>Tổng cộng</span><span th:text="${#numbers.formatDecimal(i.totalAmount,1,'POINT',i.totalAmount.stripTrailingZeros().scale() > 0 ? 2 : 0,'COMMA') + ' đ'}"></span></div></div>
<h2 class="h6 mt-4">Thanh toán</h2><ul class="list-unstyled"><li th:each="p : ${i.payments}"><strong th:text="${p.method.label}"></strong>: <span th:text="${#numbers.formatDecimal(p.amount,1,'POINT',p.amount.stripTrailingZeros().scale() > 0 ? 2 : 0,'COMMA') + ' đ'}"></span><th:block th:if="${p.cashReceived != null}"> · Khách đưa: <span th:text="${#numbers.formatDecimal(p.cashReceived,1,'POINT',p.cashReceived.stripTrailingZeros().scale() > 0 ? 2 : 0,'COMMA') + ' đ'}"></span> · Tiền thối: <span th:text="${#numbers.formatDecimal(p.changeGiven,1,'POINT',p.changeGiven.stripTrailingZeros().scale() > 0 ? 2 : 0,'COMMA') + ' đ'}"></span></th:block><span th:if="${p.referenceCode}" th:text="${' · Mã: ' + p.referenceCode}"></span></li></ul><p th:if="${i.note}" class="preserve-lines" th:text="${i.note}"></p><p class="text-center small mt-4 mb-0">Cảm ơn quý khách!</p>
</article></main><script th:src="@{/js/pos.js}" defer></script></body></html>
