<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Quầy bán hàng')}"></head>
<body class="pos-body"><nav th:replace="~{fragments/layout :: nav}"></nav>
<main id="pos-counter" class="container-fluid pos-shell pb-5" th:attr="data-token=${checkoutToken},data-owner=${employeeId + ':' + branchId},data-branch=${branchId},data-discount-limit=${discountLimit},data-serial-url=@{/pos/serials},data-accessory-url=@{/pos/accessories}">
<div class="d-flex flex-wrap justify-content-between align-items-center mb-3"><div><h1 class="h3 mb-1">Quầy bán hàng</h1><p class="text-secondary mb-0" th:text="${'Chi nhánh: ' + branchName}"></p></div><a class="btn btn-outline-secondary" th:href="@{/pos/invoices}">Danh sách hóa đơn</a></div>
<div th:replace="~{fragments/layout :: messages}"></div><div id="storage-warning" class="alert alert-warning" hidden></div>
<div class="row g-4"><section class="col-xl-8"><div class="card card-body mb-3">
<label for="serial-input" class="form-label fw-semibold">Quét hoặc nhập Serial</label><input id="serial-input" class="form-control form-control-lg" maxlength="30" autocomplete="off" placeholder="Nhập Serial rồi nhấn Enter" autofocus aria-describedby="serial-message"><div id="serial-message" class="pos-feedback mt-2" role="status" aria-live="polite"></div>
<div class="row g-2 mt-2"><div class="col-md-8"><label for="accessory-input" class="form-label">Tìm phụ kiện theo SKU hoặc tên</label><input id="accessory-input" class="form-control" autocomplete="off" maxlength="200" placeholder="Ví dụ: cáp sạc, CAP-01"></div><div class="col-md-4"><label for="accessory-quantity" class="form-label">Số lượng thêm</label><input id="accessory-quantity" class="form-control" type="number" min="1" max="2147483647" step="1" value="1"></div></div>
<div id="accessory-results" class="list-group mt-2" aria-live="polite"></div><div id="accessory-message" class="pos-feedback" role="status"></div></div>
<div class="card"><div class="card-header d-flex justify-content-between"><h2 class="h5 mb-0">Giỏ hàng</h2><span id="cart-count">0 dòng</span></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Sản phẩm / Serial</th><th>Số lượng</th><th class="text-end">Đơn giá</th><th class="text-end">Thành tiền</th><th><span class="visually-hidden">Thao tác</span></th></tr></thead><tbody id="cart-lines"></tbody></table></div><div id="empty-cart" class="p-4 text-center text-secondary">Quét Serial hoặc tìm phụ kiện để bắt đầu.</div></div>
</section><section class="col-xl-4"><form id="checkout-form" th:action="@{/pos/checkout}" method="post"><input id="checkout-payload" type="hidden" name="payload">
<div class="card card-body mb-3"><h2 class="h5">Khách hàng</h2><label for="customer-name" class="form-label">Tên khách (tùy chọn)</label><input id="customer-name" class="form-control mb-2" maxlength="100" autocomplete="name"><label for="customer-phone" class="form-label">Số điện thoại <span id="phone-required" hidden>*</span></label><input id="customer-phone" class="form-control" type="tel" maxlength="20" autocomplete="tel" placeholder="0901234567 hoặc +84901234567"><div id="phone-error" class="text-danger small" aria-live="polite"></div></div>
<div class="card card-body mb-3"><div class="d-flex justify-content-between mb-2"><span>Tiền hàng</span><strong id="subtotal">0 đ</strong></div><label for="discount" class="form-label">Giảm giá (đ)</label><input id="discount" type="number" class="form-control" min="0" step="1" value="0"><div id="discount-error" class="text-danger small" aria-live="polite"></div><div class="d-flex justify-content-between mt-3 fs-5"><strong>Phải thanh toán</strong><strong id="total" class="pos-total">0 đ</strong></div></div>
<div class="card card-body"><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">Thanh toán</h2><button id="add-payment" class="btn btn-sm btn-outline-primary" type="button">+ Thêm</button></div><div id="payment-lines"></div><p id="payment-balance" class="fw-semibold" aria-live="polite"></p><label for="note" class="form-label">Ghi chú</label><textarea id="note" class="form-control mb-3" rows="2"></textarea><button id="checkout-button" class="btn btn-success btn-lg w-100" type="submit" disabled>Thanh toán</button><p class="small text-secondary mt-2 mb-0">Giá và tồn kho được kiểm tra lại khi thanh toán.</p></div>
</form></section></div>
<template id="payment-template"><div class="payment-line border-bottom pb-3 mb-3"><div class="d-flex gap-2 mb-2"><select class="form-select payment-method" aria-label="Phương thức"><option value="CASH">Tiền mặt</option><option value="CARD">Thẻ</option><option value="TRANSFER">Chuyển khoản</option></select><button class="btn btn-outline-danger remove-payment" type="button" aria-label="Xóa thanh toán">Xóa</button></div><label class="form-label small">Số tiền (đ)<input class="form-control payment-amount" type="number" min="1" step="1" required></label><label class="cash-group form-label small">Khách đưa (đ)<input class="form-control payment-received" type="number" min="0" step="1"></label><div class="payment-change small"></div><label class="reference-group form-label small" hidden>Mã tham chiếu<input class="form-control payment-reference" maxlength="100"></label></div></template>
<template id="serial-badges"><th:block th:each="s : ${T(com.dienmay.inventory.serial.SerialStatus).values()}"><span th:replace="~{fragments/status :: serial(${s})}"></span></th:block></template>
</main><script th:src="@{/js/pos.js}" defer></script></body></html>
