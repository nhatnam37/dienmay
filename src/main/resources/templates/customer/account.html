<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/storefront :: head('Hồ sơ khách')}"></head><body class="storefront-body"><nav th:replace="~{fragments/storefront :: nav}"></nav><main class="container py-4"><div th:replace="~{fragments/layout :: messages}"></div><h1 class="h3 mb-4">Hồ sơ khách hàng</h1><p>Email: <strong th:text="${customer.email}"></strong></p><div class="row g-4"><section class="col-lg-6"><form th:action="@{/account}" method="post" th:object="${profileForm}" class="card card-body"><h2 class="h5">Thông tin cá nhân</h2><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger"><p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p></div><label for="fullName" class="form-label">Họ tên</label><input id="fullName" class="form-control" th:field="*{fullName}" maxlength="100" required><div class="text-danger small mb-3" th:errors="*{fullName}"></div><label for="phone" class="form-label">Số điện thoại</label><input id="phone" class="form-control" th:field="*{phone}" maxlength="20" type="tel" required><div class="text-danger small mb-3" th:errors="*{phone}"></div><label for="address" class="form-label">Địa chỉ</label><textarea id="address" class="form-control" th:field="*{address}" maxlength="255" rows="3"></textarea><div class="text-danger small mb-3" th:errors="*{address}"></div><button class="btn btn-primary">Lưu hồ sơ</button></form></section><section class="col-lg-6"><form th:action="@{/account/password}" method="post" th:object="${passwordForm}" class="card card-body"><h2 class="h5">Đổi mật khẩu</h2><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger"><p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p></div><label for="oldPassword" class="form-label">Mật khẩu cũ</label><input id="oldPassword" name="oldPassword" type="password" class="form-control" required autocomplete="current-password"><div class="text-danger small mb-3" th:errors="*{oldPassword}"></div><label for="password" class="form-label">Mật khẩu mới</label><input id="password" name="password" type="password" class="form-control" minlength="8" maxlength="72" required autocomplete="new-password"><div class="text-danger small mb-3" th:errors="*{password}"></div><label for="confirmPassword" class="form-label">Nhập lại mật khẩu mới</label><input id="confirmPassword" name="confirmPassword" type="password" class="form-control" minlength="8" maxlength="72" required autocomplete="new-password"><div class="text-danger small mb-3" th:errors="*{confirmPassword}"></div><button class="btn btn-outline-primary">Đổi mật khẩu</button></form></section></div></main><footer th:replace="~{fragments/storefront :: footer}"></footer></body></html>
