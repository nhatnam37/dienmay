<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/storefront :: head('Đăng ký khách')}"></head><body class="storefront-body"><nav th:replace="~{fragments/storefront :: nav}"></nav><main class="container py-4"><div th:replace="~{fragments/layout :: messages}"></div><section class="card card-body form-width-medium mx-auto"><h1 class="h3">Đăng ký khách hàng</h1><form th:action="@{/register}" method="post" th:object="${registrationForm}"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger"><p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p></div><label for="fullName" class="form-label">Họ tên</label><input class="form-control" id="fullName" th:field="*{fullName}" maxlength="100" required autocomplete="name"><div class="text-danger small mb-3" th:errors="*{fullName}"></div><label for="email" class="form-label">Email</label><input class="form-control" id="email" th:field="*{email}" type="email" maxlength="254" required autocomplete="email"><div class="text-danger small mb-3" th:errors="*{email}"></div><label for="phone" class="form-label">Số điện thoại</label><input class="form-control" id="phone" th:field="*{phone}" type="tel" maxlength="20" required placeholder="0901234567 hoặc +84901234567" autocomplete="tel"><div class="text-danger small mb-3" th:errors="*{phone}"></div><label for="password" class="form-label">Mật khẩu</label><input class="form-control" id="password" name="password" type="password" minlength="8" maxlength="72" required autocomplete="new-password"><div class="text-danger small mb-3" th:errors="*{password}"></div><label for="confirmPassword" class="form-label">Nhập lại mật khẩu</label><input class="form-control" id="confirmPassword" name="confirmPassword" type="password" minlength="8" maxlength="72" required autocomplete="new-password"><div class="text-danger small mb-3" th:errors="*{confirmPassword}"></div><button class="btn btn-primary w-100">Đăng ký và đăng nhập</button></form></section></main><footer th:replace="~{fragments/storefront :: footer}"></footer></body></html>
