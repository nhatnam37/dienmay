<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/storefront :: head('Đăng nhập khách')}"></head><body class="storefront-body"><nav th:replace="~{fragments/storefront :: nav}"></nav><main class="container py-4"><div th:replace="~{fragments/layout :: messages}"></div><section class="card card-body form-width-medium mx-auto"><h1 class="h3">Đăng nhập khách hàng</h1><div th:if="${param.error}" class="alert alert-danger">Email hoặc mật khẩu không đúng.</div><div th:if="${param.logout}" class="alert alert-success">Đã đăng xuất khách hàng.</div><form th:action="@{/customer/login}" method="post"><label for="email" class="form-label">Email</label><input type="email" name="username" id="email" class="form-control mb-3" required maxlength="254" autocomplete="username"><label for="password" class="form-label">Mật khẩu</label><input type="password" name="password" id="password" class="form-control mb-3" required autocomplete="current-password"><button class="btn btn-primary w-100">Đăng nhập khách</button></form><p class="mt-3 mb-0">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a></p></section></main><footer th:replace="~{fragments/storefront :: footer}"></footer></body></html>
