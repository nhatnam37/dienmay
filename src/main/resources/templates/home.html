<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trang chủ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h3>Xin chào, <span sec:authentication="principal.fullName"></span></h3>
    <p>Tài khoản: <b sec:authentication="name"></b> |
        Quyền: <b sec:authentication="principal.authorities"></b></p>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="btn btn-outline-primary">Trang quản trị</a>
    <form th:action="@{/logout}" method="post" class="d-inline">
        <button type="submit" class="btn btn-outline-danger">Đăng xuất</button>
    </form>
</div>
</body>
</html>
