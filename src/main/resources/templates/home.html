<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Trang chủ')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container pb-5">
<div th:replace="~{fragments/layout :: messages}"></div>
<h3>Xin chào, <span sec:authentication="principal.fullName"></span></h3>
<p>Tài khoản: <b sec:authentication="name"></b> | Quyền: <b sec:authentication="principal.authorities"></b></p>
<a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="btn btn-primary">Trang quản trị</a>
</main>
</body>
</html>
