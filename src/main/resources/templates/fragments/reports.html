<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<span th:fragment="money(value)" th:text="${#numbers.formatDecimal(value,1,'POINT',0,'COMMA')+' đ'}"></span>
<form th:fragment="filters(action)" th:action="${action}" method="get" th:object="${filter}" class="card card-body mb-4 report-filters"><div class="row g-3"><div class="col-md-3"><label for="from" class="form-label">Từ ngày</label><input id="from" type="date" class="form-control" th:field="*{from}" required th:disabled="${type=='dashboard'}"></div><div class="col-md-3"><label for="to" class="form-label">Đến ngày</label><input id="to" type="date" class="form-control" th:field="*{to}" required th:disabled="${type=='dashboard'}"></div><div th:if="${meta.admin}" class="col-md-3"><label for="branchId" class="form-label">Chi nhánh</label><select id="branchId" th:field="*{branchId}" class="form-select"><option value="">Toàn chuỗi</option><option th:each="branch : ${meta.branches}" th:value="${branch.id}" th:text="${branch.name}"></option></select></div><div class="col-md-3" th:if="${type=='revenue'}"><label for="granularity" class="form-label">Gom nhóm</label><select id="granularity" th:field="*{granularity}" class="form-select"><option value="DAY">Theo ngày</option><option value="MONTH">Theo tháng</option></select></div><div class="col-md-3" th:if="${type=='products'}"><label for="orderBy" class="form-label">Xếp hạng</label><select id="orderBy" th:field="*{orderBy}" class="form-select"><option value="QUANTITY">Số lượng</option><option value="REVENUE">Doanh số</option></select></div><th:block th:if="${type=='inventory'}"><div class="col-md-3"><label for="categoryId" class="form-label">Danh mục</label><select id="categoryId" th:field="*{categoryId}" class="form-select"><option value="">Tất cả</option><option th:each="category : ${meta.categories}" th:value="${category.id}" th:text="${category.name}"></option></select></div><div class="col-md-4"><label for="keyword" class="form-label">Từ khóa</label><input id="keyword" th:field="*{keyword}" class="form-control" maxlength="200" placeholder="Tên hoặc SKU"></div></th:block><div class="col-md-2 align-self-end"><button class="btn btn-primary">Áp dụng</button></div></div><p class="text-danger small mt-2 mb-0 report-date-error" aria-live="polite"></p></form>
<figure th:fragment="chart(kind,title)" class="card card-body report-chart mb-4" th:attr="data-report-chart=${kind}"><figcaption class="h5" th:text="${title}"></figcaption><div class="report-canvas"><canvas role="img" th:attr="aria-label=${title}"></canvas></div><p class="report-chart-error text-danger" role="status"></p><details><summary>Xem bảng dữ liệu chính xác</summary><div class="table-responsive"><table class="table table-sm report-chart-table"><thead></thead><tbody></tbody></table></div></details></figure>
</body></html>
