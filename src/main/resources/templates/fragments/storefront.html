<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:fragment="head(title)"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title + ' · Điện máy'}"></title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head><body>
<nav th:fragment="nav" class="navbar store-nav border-bottom"><div class="container d-flex flex-wrap gap-3"><a class="navbar-brand fw-bold" th:href="@{/}">Điện máy</a><a class="nav-link" th:href="@{/products}">Sản phẩm</a><form class="d-flex flex-grow-1 gap-2" th:action="@{/search}" method="get" role="search"><input class="form-control" name="keyword" aria-label="Tìm sản phẩm" placeholder="Bạn đang tìm sản phẩm gì?" maxlength="200"><button class="btn btn-primary">Tìm</button></form><a class="nav-link fw-semibold" th:href="@{/cart}">Giỏ hàng</a><th:block sec:authorize="hasRole('CUSTOMER')"><a th:href="@{/account}" class="nav-link">Tài khoản</a><a th:href="@{/account/orders}" class="nav-link">Đơn hàng</a><a th:href="@{/account/warranties}" class="nav-link">Bảo hành của tôi</a><form th:action="@{/customer/logout}" method="post"><button class="btn btn-outline-secondary btn-sm">Đăng xuất khách</button></form></th:block><th:block sec:authorize="!hasRole('CUSTOMER')"><a class="nav-link" th:href="@{/customer/login}">Đăng nhập khách</a><a class="btn btn-outline-primary" th:href="@{/register}">Đăng ký</a></th:block></div></nav>
<footer th:fragment="footer" class="store-footer mt-5 py-4 border-top"><div class="container d-flex flex-wrap justify-content-between gap-3"><span>Điện máy · Mua sắm tiện lợi</span><a th:href="@{/warranty}">Tra cứu bảo hành</a><a th:href="@{/staff}">Dành cho nhân viên</a></div></footer>
<div th:fragment="cards(products)" class="row g-4"><div class="col-sm-6 col-lg-4 col-xl-3" th:each="p : ${products}"><article class="card h-100 store-product"><a th:href="@{/products/{id}(id=${p.id})}" class="store-image-link"><img th:if="${p.imageUrl}" th:src="${p.imageUrl}" th:alt="${p.name}" class="store-product-image"><span th:unless="${p.imageUrl}" class="store-no-image">Chưa có ảnh</span></a><div class="card-body d-flex flex-column"><small class="text-secondary" th:text="${p.categoryName + ' · ' + p.brandName}"></small><h2 class="h6 mt-2"><a class="text-decoration-none" th:href="@{/products/{id}(id=${p.id})}" th:text="${p.name}"></a></h2><strong class="store-price mt-auto mb-3" th:text="${#numbers.formatDecimal(p.price,1,'POINT',0,'COMMA')+' đ'}"></strong><form th:action="@{/cart/items}" method="post"><input type="hidden" name="productId" th:value="${p.id}"><input type="hidden" name="quantity" value="1"><button class="btn btn-outline-primary w-100" type="submit">Thêm vào giỏ</button></form></div></article></div></div>
</body></html>
