<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Điện máy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand bg-dark navbar-dark mb-4">
    <div class="container flex-wrap gap-3">
        <a class="navbar-brand" th:href="@{/}">Điện máy</a>
        <div class="navbar-nav flex-row flex-wrap gap-3">
            <a class="nav-link" th:href="@{/}">Trang chủ</a>
            <th:block sec:authorize="hasRole('ADMIN')">
                <a class="nav-link" th:href="@{/admin/catalog/categories}">Danh mục</a>
                <a class="nav-link" th:href="@{/admin/catalog/brands}">Thương hiệu</a>
                <a class="nav-link" th:href="@{/admin/catalog/products}">Sản phẩm</a>
            </th:block>
        </div>
        <div class="ms-auto d-flex align-items-center gap-3 text-white">
            <span sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>
<div th:fragment="messages">
    <div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
</div>
</body>
</html>
