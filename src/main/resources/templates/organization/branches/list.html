<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Quản lý chi nhánh')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container pb-5"><div th:replace="~{fragments/layout :: messages}"></div><div class="d-flex justify-content-between mb-3"><h1 class="h3">Quản lý chi nhánh</h1><a class="btn btn-primary" th:href="@{/admin/organization/branches/new}">Thêm chi nhánh</a></div><p class="text-muted">Tạo ít nhất hai chi nhánh hoạt động để thử chuyển kho. Ngừng hoạt động giữ nguyên nhân viên và lịch sử kho.</p>
<div class="table-responsive"><table class="table table-striped"><thead><tr><th>Mã</th><th>Tên chi nhánh</th><th>Địa chỉ</th><th>Điện thoại</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="b : ${items}"><td th:text="${b.code}"></td><td th:text="${b.name}"></td><td th:text="${b.address}"></td><td th:text="${b.phone}"></td><td><span class="badge" th:classappend="${b.active ? 'bg-success' : 'bg-secondary'}" th:text="${b.active ? 'Hoạt động' : 'Ngừng hoạt động'}"></span></td><td><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/organization/branches/{id}/edit(id=${b.id})}">Sửa</a><form method="post" th:action="@{/admin/organization/branches/{id}/active(id=${b.id})}" onsubmit="return confirm('Thay đổi trạng thái hoạt động chi nhánh?')"><input type="hidden" name="active" th:value="${!b.active}"><button class="btn btn-sm btn-outline-secondary" th:text="${b.active ? 'Ngừng hoạt động' : 'Mở lại'}"></button></form></div></td></tr></tbody></table></div><a class="btn btn-outline-primary" th:href="@{/inventory/transfers/new}">Lập phiếu chuyển kho</a></main></body></html>
