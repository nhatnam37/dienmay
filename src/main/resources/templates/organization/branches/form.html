<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Quản lý chi nhánh')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container pb-5"><div th:replace="~{fragments/layout :: messages}"></div><h1 class="h3" th:text="${id == null ? 'Thêm chi nhánh' : 'Sửa chi nhánh'}"></h1><form method="post" th:object="${form}" th:action="${id == null} ? @{/admin/organization/branches} : @{/admin/organization/branches/{id}(id=${id})}" class="col-lg-7"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger"><div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div></div><div class="mb-3"><label class="form-label" for="code">Mã chi nhánh *</label><input class="form-control" id="code" th:field="*{code}" maxlength="20" required><div class="text-danger" th:errors="*{code}"></div></div><div class="mb-3"><label class="form-label" for="name">Tên chi nhánh *</label><input class="form-control" id="name" th:field="*{name}" maxlength="150" required><div class="text-danger" th:errors="*{name}"></div></div><div class="mb-3"><label class="form-label" for="address">Địa chỉ</label><input class="form-control" id="address" th:field="*{address}" maxlength="255" ><div class="text-danger" th:errors="*{address}"></div></div><div class="mb-3"><label class="form-label" for="phone">Điện thoại</label><input class="form-control" id="phone" th:field="*{phone}" maxlength="20" ><div class="text-danger" th:errors="*{phone}"></div></div><p class="form-text">Mã được lưu bằng chữ hoa, ví dụ CN-HCM. Mã không được trùng.</p><div class="form-check mb-3"><input id="active" class="form-check-input" type="checkbox" th:field="*{active}"><label for="active" class="form-check-label">Đang hoạt động</label></div><button class="btn btn-primary">Lưu chi nhánh</button> <a class="btn btn-secondary" th:href="@{/admin/organization/branches}">Quay lại</a></form></main></body></html>
