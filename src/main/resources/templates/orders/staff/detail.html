<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Xử lý đơn online')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container py-4"><div th:replace="~{fragments/layout :: messages}"></div><th:block th:with="o=${screen.order},s=${screen.order.status.name()}"><h1 class="h3" th:text="${'Đơn '+o.code}"></h1><p><span th:replace="~{fragments/order-status :: status(${o.status})}"></span> · Chi nhánh <b th:text="${o.branchName}"></b></p><p>Người nhận: <span th:text="${o.receiverName+' · '+o.receiverPhone}"></span></p><p th:if="${o.deliveryAddress}" th:text="${o.deliveryAddress}"></p><p th:text="${o.deliveryType.name()=='PICKUP'?'Nhận tại cửa hàng':'Giao tận nơi'}"></p><p>Thanh toán: <span th:text="${o.paymentMethod.name()=='ONLINE'?(o.paymentStatus=='PAID'?'ONLINE — đã thu mô phỏng':(o.paymentStatus=='REFUNDED'?'ONLINE — đã hoàn mô phỏng':'ONLINE — chưa thu')):(o.paymentMethod.name()=='COD'?'COD — thu tiền khi hoàn tất':'Thu tại quầy khi hoàn tất')}"></span></p><p th:if="${o.expiresAt}" th:text="${'Hạn giữ: '+#temporals.format(o.expiresAt,'dd/MM/yyyy HH:mm:ss')}"></p><p th:if="${o.note}" th:text="${o.note}"></p>
<div class="table-responsive"><table class="table"><thead><tr><th>Sản phẩm</th><th>Số lượng</th><th>Giá lúc đặt</th><th>Thành tiền</th></tr></thead><tbody><tr th:each="line : ${o.items}"><td th:text="${line.name}"></td><td th:text="${line.quantity}"></td><td th:text="${#numbers.formatDecimal(line.unitPrice,1,'POINT',0,'COMMA')+' đ'}"></td><td th:text="${#numbers.formatDecimal(line.lineTotal,1,'POINT',0,'COMMA')+' đ'}"></td></tr></tbody></table></div><p class="fs-5">Tổng: <b th:text="${#numbers.formatDecimal(o.totalAmount,1,'POINT',0,'COMMA')+' đ'}"></b></p>
<h2 class="h5">Serial theo từng sản phẩm</h2><ul><li th:each="line : ${screen.serials}"><span th:text="${line.productName+' — '+line.serialNo+' — '}"></span><span th:replace="~{fragments/status :: serial(${line.status})}"></span></li></ul>
<div class="d-flex gap-3 flex-wrap mb-4"><form th:if="${s=='PLACED'}" th:action="@{/staff/orders/{id}/transition(id=${o.id})}" method="post" data-lock-submit><input type="hidden" name="version" th:value="${screen.version}"><input type="hidden" name="target" value="CONFIRMED"><button type="submit" class="btn btn-primary">Xác nhận đơn</button></form>
<form th:if="${s=='CONFIRMED'}" th:action="@{/staff/orders/{id}/transition(id=${o.id})}" method="post" data-lock-submit><input type="hidden" name="version" th:value="${screen.version}"><input type="hidden" name="target" th:value="${o.deliveryType.name()=='DELIVERY'?'SHIPPING':'READY_FOR_PICKUP'}"><button type="submit" class="btn btn-primary" th:text="${o.deliveryType.name()=='DELIVERY'?'Bắt đầu giao':'Sẵn sàng nhận'}"></button></form>
<form class="card card-body" th:if="${s=='SHIPPING'||s=='READY_FOR_PICKUP'}" th:action="@{/staff/orders/{id}/transition(id=${o.id})}" method="post" data-lock-submit><input type="hidden" name="version" th:value="${screen.version}"><input type="hidden" name="target" value="COMPLETED"><th:block th:if="${o.paymentMethod.name()!='ONLINE'}"><label for="cashReceived" class="form-label">Xác nhận đã thu tiền mặt — số tiền khách đưa (đ) *</label><input id="cashReceived" name="cashReceived" type="number" min="0" step="1" class="form-control mb-2" required th:attr="data-total=${o.totalAmount}" data-order-cash><p>Tiền thối: <b data-order-change>0 đ</b></p></th:block><p th:if="${o.paymentMethod.name()=='ONLINE'}">Đã thu online; không thu thêm tiền mặt.</p><button type="submit" class="btn btn-success">Hoàn tất và tạo hóa đơn</button></form>
<form class="card card-body" th:if="${s=='PLACED'||s=='CONFIRMED'||s=='SHIPPING'||s=='READY_FOR_PICKUP'}" th:action="@{/staff/orders/{id}/transition(id=${o.id})}" method="post" data-lock-submit><input type="hidden" name="version" th:value="${screen.version}"><input type="hidden" name="target" value="CANCELLED"><label for="reason" class="form-label">Lý do hủy *</label><textarea id="reason" name="reason" class="form-control mb-2" required maxlength="255"></textarea><button type="submit" class="btn btn-outline-danger">Hủy đơn và nhả hàng</button></form></div>
<a th:if="${screen.invoiceId!=null}" class="btn btn-success mb-3" th:href="@{/pos/invoices/{id}(id=${screen.invoiceId})}">Xem / In hóa đơn</a>
<h2 class="h5">Dòng thời gian</h2><ul><li th:each="event : ${o.history}"><time th:text="${#temporals.format(event.changedAt,'dd/MM/yyyy HH:mm:ss')}"></time> · <span th:replace="~{fragments/order-status :: status(${event.toStatus})}"></span> · <span th:text="${event.actor}"></span><span th:if="${event.note}" th:text="${' — '+event.note}"></span></li></ul><a th:href="@{/staff/orders}" class="btn btn-outline-secondary">Danh sách đơn online</a></th:block></main><script th:src="@{/js/orders.js}" defer></script></body></html>
