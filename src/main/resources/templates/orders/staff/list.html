<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Đơn online')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container py-4"><div th:replace="~{fragments/layout :: messages}"></div><h1 class="h3">Đơn online</h1><p class="text-secondary">Ưu tiên đơn sắp hết hạn giữ hàng. Chi nhánh được kiểm tra lại ở service.</p><form method="get" th:action="@{/staff/orders}" class="card card-body mb-4"><div class="row g-3"><div class="col-md-3" th:if="${!branches.empty}"><label class="form-label" for="branchId">Chi nhánh</label><select id="branchId" name="branchId" class="form-select"><option value="">Tất cả</option><option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}" th:selected="${b.id==branchId}"></option></select></div><div class="col-md-3"><label for="status" class="form-label">Trạng thái</label><select id="status" name="status" class="form-select"><option value="">Tất cả</option><option th:each="s : ${T(com.dienmay.orders.entity.OrderStatus).values()}" th:value="${s}" th:text="${s.label}" th:selected="${s==status}"></option></select></div><div class="col-md-3"><label for="from" class="form-label">Từ ngày</label><input id="from" name="from" type="date" class="form-control" th:value="${from}"></div><div class="col-md-3"><label for="to" class="form-label">Đến ngày</label><input id="to" name="to" type="date" class="form-control" th:value="${to}"></div><div class="col-md-4"><label for="code" class="form-label">Mã đơn</label><input id="code" name="code" class="form-control" th:value="${code}" maxlength="50"></div><div class="col-md-4"><label for="phone" class="form-label">Số điện thoại</label><input id="phone" name="phone" class="form-control" th:value="${phone}" maxlength="20"></div><div class="col-md-2 align-self-end"><button class="btn btn-primary" type="submit">Lọc</button></div></div></form>
<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Mã đơn</th><th>Chi nhánh</th><th>Ngày đặt</th><th>Trạng thái</th><th>Hạn giữ hàng</th><th>Tổng</th></tr></thead><tbody><tr th:each="o : ${result.content}"><td><a th:href="@{/staff/orders/{id}(id=${o.id})}" th:text="${o.code}"></a></td><td th:text="${o.branchName}"></td><td th:text="${#temporals.format(o.createdAt,'dd/MM/yyyy HH:mm')}"></td><td><span th:replace="~{fragments/order-status :: status(${o.status})}"></span></td><td th:text="${o.expiresAt==null?'Không tự hết hạn':#temporals.format(o.expiresAt,'dd/MM/yyyy HH:mm')}"></td><td th:text="${#numbers.formatDecimal(o.totalAmount,1,'POINT',0,'COMMA')+' đ'}"></td></tr><tr th:if="${result.empty}"><td colspan="6">Không có đơn phù hợp.</td></tr></tbody></table></div><nav class="d-flex gap-3" th:if="${result.totalPages>1}"><a th:if="${result.hasPrevious()}" th:href="@{/staff/orders(page=${result.number-1},branchId=${branchId},status=${status},from=${from},to=${to},code=${code},phone=${phone})}">Trước</a><span th:text="${(result.number+1)+' / '+result.totalPages}"></span><a th:if="${result.hasNext()}" th:href="@{/staff/orders(page=${result.number+1},branchId=${branchId},status=${status},from=${from},to=${to},code=${code},phone=${phone})}">Sau</a></nav></main><script th:src="@{/js/orders.js}" defer></script></body></html>
