<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Tra cứu Serial')}"></head>
<body><nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container pb-5"><div th:replace="~{fragments/layout :: messages}"></div>
<h1 class="h3 mb-3">Tra cứu vòng đời Serial</h1><form method="get" th:action="@{/inventory/serials}" class="d-flex gap-2 mb-4"><input class="form-control" name="serialNo" th:value="${serialNo}" aria-label="Số Serial cần tra" placeholder="Nhập chính xác Serial" maxlength="30" required><button class="btn btn-primary text-nowrap">Tra cứu</button></form>
<th:block th:if="${serial != null}"><h2 class="h4" th:text="${serial.serialNo}"></h2><p><span th:text="${serial.sku + ' — ' + serial.productName}"></span><br>Chi nhánh hiện tại: <strong th:text="${serial.branchName}"></strong> · Trạng thái: <span th:replace="~{fragments/status :: serial(${serial.status})}"></span><br>Phiếu nhập gốc: <a th:href="@{/inventory/receipts/{id}(id=${serial.receiptId})}" th:text="${serial.receiptCode}"></a></p>
<p class="text-muted">Tra cứu chỉ đọc, áp dụng mọi chi nhánh. Liên kết chứng từ vẫn kiểm tra quyền và phạm vi chi nhánh riêng.</p>
<h3 class="h5">Dòng thời gian (cũ → mới)</h3><ol class="list-group list-group-numbered"><li th:each="h : ${serial.history}" class="list-group-item"><div class="d-flex flex-wrap justify-content-between"><strong th:text="${(h.fromStatus == null ? 'Đăng ký' : h.fromStatus) + ' → ' + h.toStatus}"></strong><time th:text="${#temporals.format(h.changedAt,'dd/MM/yyyy HH:mm:ss')}"></time></div><div th:text="${(h.fromBranch == null ? '—' : h.fromBranch) + ' → ' + (h.toBranch == null ? '—' : h.toBranch)}"></div><div>Thực hiện: <span th:text="${h.actorName}"></span> · Chứng từ: <a th:if="${h.documentUrl != null}" th:href="${h.documentUrl}" th:text="${h.documentCode}"></a><span th:if="${h.documentUrl == null}" th:text="${h.documentCode}"></span></div><div class="text-muted" th:text="${h.note}"></div></li></ol></th:block>
</main></body></html>
