<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="row(line,index)" class="count-line border rounded p-3 mb-3">
<button type="button" class="remove-line btn btn-sm btn-outline-danger float-end" th:if="${index == -1 or line.productId == null}">Bỏ dòng thêm</button><label class="form-label">Sản phẩm</label><select data-field="productId" class="product-select form-select mb-2" th:name="${'lines['+index+'].productId'}" required><option value="">-- Chọn sản phẩm --</option><option th:each="p : ${products}" th:value="${p.id}" th:text="${p.sku+' — '+p.name}" th:attr="data-serial=${p.tracksSerial}" th:selected="${p.id == line.productId}"></option></select>
<div class="serial-group"><label class="form-label">Serial thực tế đếm được (xuống dòng hoặc dấu phẩy)</label><textarea class="form-control mb-2" rows="4" data-field="serialText" th:name="${'lines['+index+'].serialText'}" th:text="${line.serialText}"></textarea><p class="form-text">Để trống nghĩa là không tìm thấy chiếc nào của sản phẩm này. Serial lạ ghi nhận ở sản phẩm đang kiểm đếm để báo cáo.</p></div>
<div class="quantity-group"><label class="form-label">Số lượng thực tế (nhập 0 nếu không còn)</label><input class="form-control mb-2" type="number" min="0" max="2147483647" step="1" data-field="countedQty" th:name="${'lines['+index+'].countedQty'}" th:value="${line.countedQty}"></div>
<label class="form-label">Lý do chênh lệch / ghi chú (bắt buộc nếu thiếu)</label><textarea class="form-control" rows="2" data-field="note" th:name="${'lines['+index+'].note'}" th:text="${line.note}"></textarea></div></body></html>
