<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Kiểm kê kho')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container pb-5"><div th:replace="~{fragments/layout :: messages}"></div><div class="d-flex justify-content-between mb-3"><h1 class="h3">Kiểm kê kho</h1><a class="btn btn-primary" th:href="@{/inventory/stocktakes/new}">Mở phiếu kiểm kê</a></div>
<form class="row g-2 mb-3" method="get" th:action="@{/inventory/stocktakes}"><div class="col-md-4" th:if="${isAdmin}"><label for="branchId" class="form-label">Chi nhánh</label><select name="branchId" id="branchId" class="form-select"><option value="">Tất cả</option><option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}" th:selected="${b.id == branchId}"></option></select></div><div class="col-md-4"><label for="status" class="form-label">Trạng thái</label><select id="status" name="status" class="form-select"><option value="">Tất cả</option><option value="OPEN" th:selected="${status != null and status.name() == 'OPEN'}">Đang kiểm kê</option><option value="CLOSED" th:selected="${status != null and status.name() == 'CLOSED'}">Đã chốt</option></select></div><div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary">Lọc</button></div></form>
<div class="table-responsive"><table class="table table-striped"><thead><tr><th>Mã phiếu</th><th>Chi nhánh</th><th>Trạng thái</th><th>Người mở</th><th>Ngày mở</th></tr></thead><tbody><tr th:each="s : ${takes.content}"><td><a th:href="@{/inventory/stocktakes/{id}(id=${s.id})}" th:text="${s.code}"></a></td><td th:text="${s.branchName}"></td><td th:text="${s.status.name() == 'OPEN' ? 'Đang kiểm kê' : 'Đã chốt'}"></td><td th:text="${s.createdBy}"></td><td th:text="${#temporals.format(s.createdAt,'dd/MM/yyyy HH:mm')}"></td></tr><tr th:if="${takes.empty}"><td colspan="5">Chưa có phiếu phù hợp.</td></tr></tbody></table></div>
<nav class="d-flex gap-2" th:if="${takes.totalPages > 1}"><a th:if="${takes.hasPrevious()}" th:href="@{/inventory/stocktakes(page=${takes.number-1},branchId=${branchId},status=${status})}">Trước</a><span th:text="${'Trang '+(takes.number+1)+'/'+takes.totalPages}"></span><a th:if="${takes.hasNext()}" th:href="@{/inventory/stocktakes(page=${takes.number+1},branchId=${branchId},status=${status})}">Sau</a></nav></main></body></html>
