<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Kiểm kê kho')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container pb-5"><div th:replace="~{fragments/layout :: messages}"></div><h1 class="h3" th:text="${'Nhập kết quả '+detail.summary.code}"></h1><p>Nhập đủ các sản phẩm trong mốc. Sản phẩm có hàng dư chưa có tồn có thể thêm dòng. Tồn thay đổi thì phải đối chiếu lại.</p><div class="alert alert-danger" th:if="${countErrors}"><ul><li th:each="err : ${countErrors}" th:text="${err}"></li></ul></div><form method="post" th:object="${form}" th:action="@{/inventory/stocktakes/{id}/count(id=${detail.summary.id})}"><div id="count-lines"><th:block th:each="line,stat : *{lines}"><div th:replace="~{inventory/stocktakes/row :: row(${line},${stat.index})}"></div></th:block></div><button id="add-line" class="btn btn-outline-primary mb-3" type="button">+ Thêm sản phẩm đếm dư</button><div><button class="btn btn-primary">Lưu kết quả và xem chênh lệch</button> <a class="btn btn-secondary" th:href="@{/inventory/stocktakes/{id}(id=${detail.summary.id})}">Quay lại</a></div></form><template id="line-template"><div th:replace="~{inventory/stocktakes/row :: row(${blankLine},-1)}"></div></template>
<script>
const rows=document.getElementById('count-lines');
function mode(row){const selected=row.querySelector('.product-select').selectedOptions[0];const serial=selected && selected.dataset.serial==='true';row.querySelector('.serial-group').hidden=!serial;row.querySelector('.quantity-group').hidden=serial;row.querySelector('[data-field="serialText"]').disabled=!serial;row.querySelector('[data-field="countedQty"]').disabled=serial;row.querySelector('[data-field="countedQty"]').required=!serial;}
function renumber(){rows.querySelectorAll('.count-line').forEach((row,index)=>{row.querySelectorAll('[data-field]').forEach(field=>field.name='lines['+index+'].'+field.dataset.field);mode(row);});}
document.getElementById('add-line').addEventListener('click',()=>{rows.append(document.getElementById('line-template').content.cloneNode(true));renumber();});rows.addEventListener('change',event=>{if(event.target.matches('.product-select'))mode(event.target.closest('.count-line'));});rows.addEventListener('click',event=>{if(event.target.matches('.remove-line')){event.target.closest('.count-line').remove();renumber();}});renumber();
</script></main></body></html>
