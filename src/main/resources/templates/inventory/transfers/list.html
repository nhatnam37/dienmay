<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Phiếu chuyển kho')}"></head>
<body><nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container pb-5"><div th:replace="~{fragments/layout :: messages}"></div>
<div class="d-flex justify-content-between mb-3"><h1 class="h3">Phiếu chuyển kho</h1><a th:href="@{/inventory/transfers/new}" class="btn btn-primary">Lập phiếu nháp</a></div>
<form method="get" th:action="@{/inventory/transfers}" class="row g-2 mb-4">
<div th:if="${isAdmin}" class="col-md-4"><label for="branchId" class="form-label">Chi nhánh xét chiều</label><select id="branchId" name="branchId" class="form-select"><option value="">Tất cả (chiều đi/đến xét chi nhánh tài khoản)</option><option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}" th:selected="${b.id == branchId}"></option></select></div>
<div class="col-md-3"><label for="status" class="form-label">Trạng thái</label><select id="status" name="status" class="form-select"><option value="">Tất cả</option><option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s == status}"></option></select></div>
<div class="col-md-3"><label for="direction" class="form-label">Chiều chuyển</label><select id="direction" name="direction" class="form-select"><option value="ALL" th:selected="${direction == 'ALL'}">Cả hai</option><option value="OUTGOING" th:selected="${direction == 'OUTGOING'}">Đi</option><option value="INCOMING" th:selected="${direction == 'INCOMING'}">Đến</option></select></div>
<div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary">Lọc</button></div></form>
<div class="table-responsive"><table class="table table-striped"><thead><tr><th>Mã phiếu</th><th>Từ chi nhánh</th><th>Đến chi nhánh</th><th>Trạng thái</th><th>Ngày lập</th></tr></thead><tbody><tr th:each="t : ${transfers.content}"><td><a th:href="@{/inventory/transfers/{id}(id=${t.id})}" th:text="${t.code}"></a></td><td th:text="${t.fromBranchName}"></td><td th:text="${t.toBranchName}"></td><td><span class="badge" th:classappend="${t.status.name() == 'RECEIVED' ? 'bg-success' : (t.status.name() == 'SHIPPED' ? 'bg-primary' : 'bg-secondary')}" th:text="${t.status.label}"></span></td><td th:text="${#temporals.format(t.createdAt,'dd/MM/yyyy HH:mm')}"></td></tr><tr th:if="${transfers.empty}"><td colspan="5" class="text-center text-muted">Chưa có phiếu phù hợp.</td></tr></tbody></table></div>
<nav th:if="${transfers.totalPages > 1}" class="d-flex gap-2 align-items-center"><a th:if="${transfers.hasPrevious()}" th:href="@{/inventory/transfers(page=${transfers.number-1},status=${status},direction=${direction},branchId=${branchId})}" class="btn btn-outline-primary">Trước</a><span th:text="${'Trang ' + (transfers.number+1) + '/' + transfers.totalPages}"></span><a th:if="${transfers.hasNext()}" th:href="@{/inventory/transfers(page=${transfers.number+1},status=${status},direction=${direction},branchId=${branchId})}" class="btn btn-outline-primary">Sau</a></nav>
</main></body></html>
