<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Chi tiết phiếu chuyển')}"></head>
<body><nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container pb-5"><div th:replace="~{fragments/layout :: messages}"></div>
<h1 class="h3" th:text="${detail.summary.code}"></h1><p><strong th:text="${detail.summary.fromBranchName}"></strong> → <strong th:text="${detail.summary.toBranchName}"></strong> · <span class="badge bg-secondary" th:text="${detail.summary.status.label}"></span></p>
<dl class="row"><dt class="col-sm-3">Người lập</dt><dd class="col-sm-9" th:text="${detail.createdBy}"></dd><dt class="col-sm-3">Người xuất / thời gian</dt><dd class="col-sm-9" th:text="${detail.shippedBy == null ? 'Chưa xuất' : detail.shippedBy + ' / ' + #temporals.format(detail.shippedAt,'dd/MM/yyyy HH:mm')}"></dd><dt class="col-sm-3">Người nhận / thời gian</dt><dd class="col-sm-9" th:text="${detail.receivedBy == null ? 'Chưa nhận' : detail.receivedBy + ' / ' + #temporals.format(detail.receivedAt,'dd/MM/yyyy HH:mm')}"></dd><dt class="col-sm-3">Ghi chú</dt><dd class="col-sm-9" th:text="${detail.note}"></dd></dl>
<div class="table-responsive"><table class="table table-striped"><thead><tr><th>SKU</th><th>Sản phẩm</th><th>Serial</th><th>Số lượng</th></tr></thead><tbody><tr th:each="i : ${detail.items}"><td th:text="${i.sku}"></td><td th:text="${i.productName}"></td><td><a th:if="${i.serialNo != null}" th:href="@{/inventory/serials(serialNo=${i.serialNo})}" th:text="${i.serialNo}"></a><span th:if="${i.serialNo == null}">—</span></td><td th:text="${i.quantity}"></td></tr></tbody></table></div>
<div class="d-flex flex-wrap gap-2"><form th:if="${detail.canShip}" method="post" th:action="@{/inventory/transfers/{id}/ship(id=${detail.summary.id})}" onsubmit="return confirm('Xuất toàn bộ hàng trong phiếu?')"><button class="btn btn-primary">Xuất kho</button></form><form th:if="${detail.canReceive}" method="post" th:action="@{/inventory/transfers/{id}/receive(id=${detail.summary.id})}" onsubmit="return confirm('Xác nhận đã nhận đủ toàn bộ hàng?')"><button class="btn btn-success">Nhận hàng</button></form><form th:if="${detail.canCancel}" method="post" th:action="@{/inventory/transfers/{id}/cancel(id=${detail.summary.id})}" onsubmit="return confirm('Hủy phiếu nháp?')"><button class="btn btn-outline-danger">Hủy phiếu</button></form><a class="btn btn-secondary" th:href="@{/inventory/transfers}">Danh sách</a></div>
</main></body></html>
