<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="row(line,index)" class="quantity-line row g-2 mb-2 align-items-end">
<div class="col-md-7"><label class="form-label">Sản phẩm không Serial</label><select class="form-select" data-field="productId" th:name="${'lines['+index+'].productId'}" aria-label="Sản phẩm phụ kiện"><option value="">-- Không chọn --</option><option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}" th:selected="${p.id == line.productId}"></option></select></div>
<div class="col-md-3"><label class="form-label">Số lượng</label><input type="number" min="1" step="1" class="form-control" data-field="quantity" th:name="${'lines['+index+'].quantity'}" th:value="${line.quantity}" aria-label="Số lượng chuyển"></div>
<div class="col-md-2"><button type="button" class="remove-line btn btn-outline-danger">Xóa dòng</button></div>
</div></body></html>
