<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Phiếu nhập kho')}"></head>
<body><nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container pb-5"><div th:replace="~{fragments/layout :: messages}"></div>
<div class="d-flex justify-content-between mb-3"><h1 class="h3">Phiếu nhập kho</h1><a th:href="@{/inventory/receipts/new}" class="btn btn-primary">Lập phiếu nhập</a></div>
<form method="get" th:action="@{/inventory/receipts}" class="row g-2 mb-4">
<div th:if="${isAdmin}" class="col-md-3"><label class="form-label" for="branchId">Chi nhánh</label><select id="branchId" name="branchId" class="form-select"><option value="">Tất cả</option><option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}" th:selected="${b.id == branchId}"></option></select></div>
<div class="col-md-3"><label class="form-label" for="supplierId">Nhà cung cấp</label><select id="supplierId" name="supplierId" class="form-select"><option value="">Tất cả</option><option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}" th:selected="${s.id == supplierId}"></option></select></div>
<div class="col-md-2"><label class="form-label" for="from">Từ ngày</label><input id="from" type="date" name="from" th:value="${from}" class="form-control"></div><div class="col-md-2"><label class="form-label" for="to">Đến ngày</label><input id="to" type="date" name="to" th:value="${to}" class="form-control"></div><div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary">Lọc</button></div></form>
<div class="table-responsive"><table class="table table-striped"><thead><tr><th>Mã phiếu</th><th>Chi nhánh</th><th>Nhà cung cấp</th><th>Người nhập</th><th>Ngày nhập</th></tr></thead><tbody>
<tr th:each="r : ${receipts.content}"><td><a th:href="@{/inventory/receipts/{id}(id=${r.id})}" th:text="${r.code}"></a></td><td th:text="${r.branchName}"></td><td th:text="${r.supplierName}"></td><td th:text="${r.createdByName}"></td><td th:text="${#temporals.format(r.createdAt,'dd/MM/yyyy HH:mm')}"></td></tr>
<tr th:if="${receipts.empty}"><td colspan="5" class="text-center text-muted">Không có phiếu phù hợp.</td></tr></tbody></table></div>
<nav class="d-flex align-items-center gap-2" th:if="${receipts.totalPages > 1}">
<a th:if="${receipts.hasPrevious()}" th:href="@{/inventory/receipts(page=${receipts.number-1},branchId=${branchId},supplierId=${supplierId},from=${from},to=${to})}" class="btn btn-outline-primary">Trước</a><span th:text="${'Trang ' + (receipts.number+1) + '/' + receipts.totalPages}"></span><a th:if="${receipts.hasNext()}" th:href="@{/inventory/receipts(page=${receipts.number+1},branchId=${branchId},supplierId=${supplierId},from=${from},to=${to})}" class="btn btn-outline-primary">Sau</a></nav>
</main></body></html>
