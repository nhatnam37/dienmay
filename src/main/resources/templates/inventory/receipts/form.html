<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Lập phiếu nhập')}"></head>
<body><nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container pb-5"><div th:replace="~{fragments/layout :: messages}"></div>
<h1 class="h3 mb-3">Lập phiếu nhập kho</h1>
<div th:if="${receiptErrors}" class="alert alert-danger"><strong>Vui lòng sửa các lỗi sau:</strong><ul class="mb-0"><li th:each="err : ${receiptErrors}" th:text="${err}"></li></ul></div>
<form method="post" th:action="@{/inventory/receipts}" th:object="${form}" id="receipt-form">
<div class="row g-3 mb-4"><div class="col-md-6"><label for="supplierId" class="form-label">Nhà cung cấp *</label><select id="supplierId" th:field="*{supplierId}" class="form-select" required><option value="">-- Chọn nhà cung cấp --</option><option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"></option></select></div>
<div class="col-md-6" th:if="${isAdmin}"><label for="branchId" class="form-label">Chi nhánh nhập *</label><select id="branchId" th:field="*{branchId}" class="form-select" required><option value="">-- Chọn chi nhánh --</option><option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}"></option></select></div>
<div th:unless="${isAdmin}" class="col-md-6"><label class="form-label">Chi nhánh nhập</label><input type="hidden" th:field="*{branchId}"><p class="form-control-plaintext" th:each="b : ${branches}" th:text="${b.name}"></p></div>
<div class="col-12"><label for="note" class="form-label">Ghi chú</label><textarea id="note" th:field="*{note}" class="form-control" rows="2"></textarea></div></div>
<div id="receipt-lines"><th:block th:each="line,stat : *{lines}"><div th:replace="~{inventory/receipts/row :: row(${line},${stat.index})}"></div></th:block></div>
<button type="button" id="add-line" class="btn btn-outline-primary mb-3">+ Thêm dòng</button>
<p class="text-muted">Mỗi sản phẩm chỉ có một dòng. Phiếu hoàn tất không sửa/xóa; sai sót xử lý bằng điều chỉnh/kiểm kê.</p>
<button class="btn btn-primary" type="submit">Hoàn tất nhập kho</button> <a th:href="@{/inventory/receipts}" class="btn btn-secondary">Hủy</a></form>
<template id="line-template"><div th:replace="~{inventory/receipts/row :: row(${blankLine},0)}"></div></template>
<script>
const lines = document.getElementById('receipt-lines');
function updateLine(row) {
    const select = row.querySelector('.product-select');
    const option = select.selectedOptions[0];
    const serial = option && option.dataset.serial === 'true';
    row.querySelector('.serial-group').hidden = !serial;
    row.querySelector('.quantity-group').hidden = serial;
    row.querySelector('[data-field="serialText"]').disabled = !serial;
    row.querySelector('[data-field="serialText"]').required = serial;
    row.querySelector('[data-field="quantity"]').disabled = serial;
    row.querySelector('[data-field="quantity"]').required = !serial;
    row.querySelector('.serial-help').textContent = serial && option.dataset.type === 'IMEI'
        ? 'IMEI: 15 chữ số, đúng Luhn. Tối đa 500/dòng; số lượng tự tính.'
        : 'Serial thường: 5–30 ký tự A–Z, 0–9, gạch ngang. Tối đa 500/dòng.';
}
function renumber() {
    lines.querySelectorAll('.receipt-line').forEach((row, index) => {
        row.querySelector('.row-label').textContent = 'Dòng ' + (index + 1);
        row.querySelectorAll('[data-field]').forEach(field => field.name = 'lines[' + index + '].' + field.dataset.field);
        updateLine(row);
    });
}
document.getElementById('add-line').addEventListener('click', () => {
    lines.append(document.getElementById('line-template').content.cloneNode(true)); renumber();
});
lines.addEventListener('change', event => { if(event.target.matches('.product-select')) updateLine(event.target.closest('.receipt-line')); });
lines.addEventListener('click', event => { if(event.target.matches('.remove-line')) {event.target.closest('.receipt-line').remove(); renumber();} });
renumber();
</script>
</main></body></html>
