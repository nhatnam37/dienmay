<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nhà cung cấp')}"></head>
<body><nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container pb-5"><div th:replace="~{fragments/layout :: messages}"></div>
<div class="d-flex justify-content-between mb-3"><h1 class="h3">Nhà cung cấp</h1><a th:href="@{/inventory/suppliers/new}" class="btn btn-primary">Thêm nhà cung cấp</a></div>
<form method="get" th:action="@{/inventory/suppliers}" class="d-flex gap-2 mb-3"><input name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm tên nhà cung cấp"><button class="btn btn-primary">Tìm</button></form>
<div class="table-responsive"><table class="table table-striped align-middle"><thead><tr><th>Tên</th><th>Điện thoại</th><th>Địa chỉ</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>
<tr th:each="s : ${suppliers.content}"><td th:text="${s.name}"></td><td th:text="${s.phone}"></td><td th:text="${s.address}"></td><td><span class="badge" th:classappend="${s.active ? 'text-bg-success' : 'text-bg-secondary'}" th:text="${s.active ? 'Hoạt động' : 'Ngừng hoạt động'}"></span></td><td class="text-nowrap">
<a th:href="@{/inventory/suppliers/{id}/edit(id=${s.id})}" class="btn btn-sm btn-outline-primary">Sửa</a>
<form method="post" th:action="@{/inventory/suppliers/{id}/delete(id=${s.id})}" class="d-inline" onsubmit="return confirm('Nếu đã có phiếu nhập, nhà cung cấp sẽ ngừng hoạt động thay vì bị xóa. Tiếp tục?')"><button class="btn btn-sm btn-outline-danger">Xóa / Ngừng hoạt động</button></form></td></tr>
<tr th:if="${suppliers.empty}"><td colspan="5" class="text-center text-muted">Chưa có nhà cung cấp phù hợp.</td></tr></tbody></table></div>
<nav class="d-flex gap-2" th:if="${suppliers.totalPages > 1}"><a th:if="${suppliers.hasPrevious()}" th:href="@{/inventory/suppliers(page=${suppliers.number - 1},keyword=${keyword})}" class="btn btn-outline-primary">Trước</a><span th:text="${'Trang ' + (suppliers.number+1) + '/' + suppliers.totalPages}"></span><a th:if="${suppliers.hasNext()}" th:href="@{/inventory/suppliers(page=${suppliers.number+1},keyword=${keyword})}" class="btn btn-outline-primary">Sau</a></nav>
</main></body></html>
