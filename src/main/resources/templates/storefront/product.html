<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/storefront :: head('Chi tiết sản phẩm')}"></head><body class="storefront-body"><nav th:replace="~{fragments/storefront :: nav}"></nav><main class="container py-4"><div th:replace="~{fragments/layout :: messages}"></div><div class="row g-4" th:with="p=${detail.product}"><div class="col-md-5"><div class="card p-3"><img th:if="${p.imageUrl}" th:src="${p.imageUrl}" th:alt="${p.name}" class="store-detail-image"><div th:unless="${p.imageUrl}" class="store-no-image store-detail-placeholder">Chưa có ảnh sản phẩm</div></div></div><div class="col-md-7"><p class="text-secondary" th:text="${p.categoryName+' · '+p.brandName}"></p><h1 class="h3" th:text="${p.name}"></h1><p class="fs-3 fw-bold store-price" th:text="${#numbers.formatDecimal(p.price,1,'POINT',0,'COMMA')+' đ'}"></p><p th:text="${detail.warrantyMonths>0 ? 'Bảo hành: '+detail.warrantyMonths+' tháng' : 'Không áp dụng bảo hành'}"></p><form th:action="@{/cart/items}" method="post" class="d-flex gap-3 mb-4"><input type="hidden" name="productId" th:value="${p.id}"><label for="quantity" class="form-label align-self-center">Số lượng</label><input id="quantity" name="quantity" type="number" min="1" max="20" step="1" value="1" class="form-control cart-quantity" required><button class="btn btn-primary" type="submit">Thêm vào giỏ</button></form><h2 class="h5">Tình trạng tại chi nhánh</h2><ul class="list-group"><li class="list-group-item d-flex justify-content-between" th:each="s : ${detail.availability}"><span th:text="${s.branchName}"></span><span th:class="${s.available>0 ? 'text-success' : 'text-secondary'}" th:text="${s.available>0 ? (s.available<=5 ? 'Còn '+s.available+' sản phẩm' : 'Còn hàng') : 'Hết hàng'}"></span></li></ul></div><section class="col-12"><h2 class="h4">Mô tả</h2><p class="preserve-lines" th:text="${detail.description ?: 'Chưa có mô tả.'}"></p></section></div></main><footer th:replace="~{fragments/storefront :: footer}"></footer></body></html>
