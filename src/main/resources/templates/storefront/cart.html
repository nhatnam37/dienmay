<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/storefront :: head('Giỏ hàng')}"></head><body class="storefront-body"><nav th:replace="~{fragments/storefront :: nav}"></nav><main class="container py-4"><div th:replace="~{fragments/layout :: messages}"></div><h1 class="h3 mb-4">Giỏ hàng</h1><p th:if="${cart.lines.empty}" class="alert alert-light">Giỏ hàng đang trống. <a th:href="@{/products}">Tiếp tục mua sắm</a></p><th:block th:unless="${cart.lines.empty}"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Sản phẩm</th><th>Đơn giá hiện tại</th><th>Số lượng</th><th>Thành tiền</th><th></th></tr></thead><tbody><tr th:each="line : ${cart.lines}"><td><a th:href="@{/products/{id}(id=${line.productId})}" th:text="${line.name}"></a><p class="text-danger small mb-0" th:if="${line.warning}" th:text="${line.warning}"></p></td><td class="text-nowrap" th:text="${#numbers.formatDecimal(line.price,1,'POINT',0,'COMMA')+' đ'}"></td><td><form th:action="@{/cart/items/{id}(id=${line.productId})}" method="post" class="d-flex gap-2"><input name="quantity" type="number" min="1" max="20" step="1" th:value="${line.quantity}" class="form-control cart-quantity" aria-label="Số lượng" required><button class="btn btn-outline-secondary btn-sm">Cập nhật</button></form></td><td class="text-nowrap" th:text="${#numbers.formatDecimal(line.lineTotal,1,'POINT',0,'COMMA')+' đ'}"></td><td><form method="post" th:action="@{/cart/items/{id}/remove(id=${line.productId})}"><button class="btn btn-outline-danger btn-sm">Xóa</button></form></td></tr></tbody></table></div><p class="fs-5 fw-semibold text-end">Tạm tính: <span th:text="${#numbers.formatDecimal(cart.total,1,'POINT',0,'COMMA')+' đ'}"></span></p><p class="text-secondary">Giá và tồn kho được kiểm tra lại mỗi lần xem. Thêm giỏ chưa giữ hàng; số lượng có thể thay đổi trước khi đặt.</p><div class="d-flex gap-3 justify-content-end"><form th:action="@{/cart/clear}" method="post"><button class="btn btn-outline-danger">Xóa hết giỏ</button></form><a th:if="${cart.canCheckout}" class="btn btn-primary" th:href="@{/checkout}">Đặt hàng</a><button th:unless="${cart.canCheckout}" class="btn btn-primary" disabled>Kiểm tra các dòng cảnh báo trước khi đặt hàng</button></div></th:block></main><footer th:replace="~{fragments/storefront :: footer}"></footer></body></html>
