<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/storefront :: head('Đặt hàng')}"></head><body class="storefront-body"><nav th:replace="~{fragments/storefront :: nav}"></nav><main class="container py-4"><div th:replace="~{fragments/layout :: messages}"></div><h1 class="h3">Đặt hàng</h1><p>Xin chào, <strong th:text="${fullName}"></strong>. Giá và tồn sẽ được kiểm tra lại khi đặt.</p>
<form th:action="@{/checkout}" method="post" th:object="${checkoutForm}" data-checkout-form data-lock-submit>
<div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div>
<input type="hidden" th:field="*{placeToken}"><div class="row g-4"><section class="col-lg-7"><div class="card card-body mb-3">
<h2 class="h5">Chi nhánh đảm nhận</h2><label for="branchId" class="form-label">Chọn chi nhánh đủ toàn bộ giỏ *</label><select id="branchId" class="form-select mb-3" th:field="*{branchId}" required><option value="">Chọn chi nhánh</option><option th:each="b : ${branches}" th:value="${b.id}" th:disabled="${!b.eligible}" th:text="${b.name+(b.eligible?' — Đủ hàng':' — '+b.reason)}"></option></select>
<ul class="small text-secondary" th:if="${!branches.empty}"><li th:each="b : ${branches}" th:if="${!b.eligible}" th:text="${b.name+': '+b.reason}"></li></ul>
<label for="deliveryType" class="form-label">Cách nhận *</label><select id="deliveryType" th:field="*{deliveryType}" class="form-select mb-3"><option value="PICKUP">Nhận tại cửa hàng</option><option value="DELIVERY">Giao tận nơi</option></select>
<label for="receiverName" class="form-label">Tên người nhận *</label><input id="receiverName" th:field="*{receiverName}" class="form-control mb-3" required maxlength="100">
<label for="receiverPhone" class="form-label">Số điện thoại người nhận *</label><input id="receiverPhone" th:field="*{receiverPhone}" class="form-control mb-3" type="tel" required maxlength="20" placeholder="09xxxxxxxx hoặc +84xxxxxxxxx">
<div data-address-group><label for="deliveryAddress" class="form-label">Địa chỉ giao hàng *</label><textarea id="deliveryAddress" th:field="*{deliveryAddress}" class="form-control mb-3" maxlength="255" rows="3"></textarea></div>
<label for="paymentMethod" class="form-label">Thanh toán *</label><select id="paymentMethod" th:field="*{paymentMethod}" class="form-select mb-3"><option value="PAY_AT_STORE">Thanh toán tại cửa hàng</option><option value="COD">Thanh toán khi giao hàng (COD)</option><option value="ONLINE">Thanh toán online mô phỏng</option></select>
<label for="note" class="form-label">Ghi chú</label><textarea id="note" th:field="*{note}" class="form-control" maxlength="255" rows="2"></textarea></div></section>
<aside class="col-lg-5"><div class="card card-body"><h2 class="h5">Giỏ hàng</h2><ul class="list-group list-group-flush"><li class="list-group-item px-0" th:each="line : ${cart.lines}"><div class="d-flex justify-content-between gap-2"><span th:text="${line.name+' × '+line.quantity}"></span><b class="text-nowrap" th:text="${#numbers.formatDecimal(line.lineTotal,1,'POINT',0,'COMMA')+' đ'}"></b></div><p class="text-danger small" th:if="${line.warning}" th:text="${line.warning}"></p></li></ul><p class="fs-5 mt-3">Tổng: <b th:text="${#numbers.formatDecimal(cart.total,1,'POINT',0,'COMMA')+' đ'}"></b></p><p class="small text-secondary">Chỉ giữ hàng sau khi đặt thành công. ONLINE đang là cổng giả lập, không thu tiền thật.</p><button class="btn btn-primary" type="submit" th:disabled="${!cart.canCheckout}">Đặt hàng</button><a class="btn btn-outline-secondary mt-2" th:href="@{/cart}">Về giỏ hàng</a></div></aside></div></form></main><footer th:replace="~{fragments/storefront :: footer}"></footer><script th:src="@{/js/orders.js}" defer></script></body></html>
