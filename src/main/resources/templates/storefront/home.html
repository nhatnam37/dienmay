<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/storefront :: head('Cửa hàng điện máy')}"></head><body class="storefront-body"><nav th:replace="~{fragments/storefront :: nav}"></nav><main class="container py-4"><div th:replace="~{fragments/layout :: messages}"></div><section class="store-hero p-4 p-md-5 rounded-4 mb-4"><p class="text-uppercase small fw-semibold">Điện máy cho mọi nhà</p><h1 class="display-6 fw-bold">Chọn sản phẩm phù hợp với bạn</h1><p class="lead">Khám phá sản phẩm và xem tình trạng còn hàng tại từng chi nhánh.</p><a class="btn btn-primary" th:href="@{/products}">Khám phá sản phẩm</a></section><section class="mb-4"><h2 class="h4">Danh mục</h2><div class="d-flex flex-wrap gap-2"><a class="btn btn-outline-secondary" th:each="c : ${categories}" th:href="@{/products(categoryId=${c.id})}" th:text="${c.name}"></a></div></section><section><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h4 mb-0">Sản phẩm mới</h2><a th:href="@{/products}">Xem tất cả</a></div><div th:replace="~{fragments/storefront :: cards(${products})}"></div><p th:if="${#lists.isEmpty(products)}" class="text-secondary">Chưa có sản phẩm đang kinh doanh.</p></section></main><footer th:replace="~{fragments/storefront :: footer}"></footer></body></html>
