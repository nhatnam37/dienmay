<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/storefront :: head('Sản phẩm')}"></head><body class="storefront-body"><nav th:replace="~{fragments/storefront :: nav}"></nav><main class="container py-4"><div th:replace="~{fragments/layout :: messages}"></div><h1 class="h3 mb-4">Sản phẩm</h1><form class="card card-body mb-4" method="get" th:action="@{/products}"><div class="row g-3"><div class="col-md-4"><label class="form-label" for="keyword">Từ khóa</label><input id="keyword" name="keyword" class="form-control" maxlength="200" th:value="${keyword}"></div><div class="col-md-4"><label class="form-label" for="categoryId">Danh mục</label><select id="categoryId" name="categoryId" class="form-select"><option value="">Tất cả</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == categoryId}"></option></select></div><div class="col-md-4"><label class="form-label" for="brandId">Thương hiệu</label><select id="brandId" name="brandId" class="form-select"><option value="">Tất cả</option><option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}" th:selected="${b.id == brandId}"></option></select></div><div class="col-md-3"><label class="form-label" for="minPrice">Giá từ (đ)</label><input type="number" min="0" step="1" class="form-control" name="minPrice" id="minPrice" th:value="${minPrice}"></div><div class="col-md-3"><label class="form-label" for="maxPrice">Giá đến (đ)</label><input type="number" min="0" step="1" class="form-control" name="maxPrice" id="maxPrice" th:value="${maxPrice}"></div><div class="col-md-4"><label class="form-label" for="sort">Sắp xếp</label><select id="sort" name="sort" class="form-select"><option value="newest" th:selected="${sort == 'newest'}">Mới nhất</option><option value="priceAsc" th:selected="${sort == 'priceAsc'}">Giá tăng dần</option><option value="priceDesc" th:selected="${sort == 'priceDesc'}">Giá giảm dần</option></select></div><div class="col-md-2 align-self-end"><button class="btn btn-primary w-100">Lọc</button></div></div></form><div th:replace="~{fragments/storefront :: cards(${page.content})}"></div><p th:if="${page.empty}" class="alert alert-light mt-3">Không có sản phẩm phù hợp.</p><nav th:if="${page.totalPages>1}" class="d-flex justify-content-center gap-3 mt-4" aria-label="Phân trang"><a th:if="${page.hasPrevious()}" th:href="@{/products(page=${page.number-1},keyword=${keyword},categoryId=${categoryId},brandId=${brandId},minPrice=${minPrice},maxPrice=${maxPrice},sort=${sort})}">Trước</a><span th:text="${(page.number+1)+' / '+page.totalPages}"></span><a th:if="${page.hasNext()}" th:href="@{/products(page=${page.number+1},keyword=${keyword},categoryId=${categoryId},brandId=${brandId},minPrice=${minPrice},maxPrice=${maxPrice},sort=${sort})}">Sau</a></nav></main><footer th:replace="~{fragments/storefront :: footer}"></footer></body></html>
