<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/storefront :: head('Chi tiết đơn hàng')}"></head><body class="storefront-body"><nav th:replace="~{fragments/storefront :: nav}"></nav><main class="container py-4"><div th:replace="~{fragments/layout :: messages}"></div><h1 class="h3">Đơn <span th:text="${order.code}"></span></h1><p>Trạng thái: <b th:replace="~{storefront/orders/fragments :: status(${order.status})}"></b></p>
<p th:if="${order.expiresAt!=null}">Hạn giữ hàng: <time th:text="${#temporals.format(order.expiresAt,'dd/MM/yyyy HH:mm:ss')}"></time> (giờ Việt Nam). <strong data-countdown th:attr="data-expires-millis=${expiresMillis}"></strong></p>
<div class="row g-4"><section class="col-lg-8"><div class="table-responsive"><table class="table"><thead><tr><th>Sản phẩm</th><th>Số lượng</th><th>Đơn giá</th><th>Thành tiền</th></tr></thead><tbody><tr th:each="line : ${order.items}"><td th:text="${line.name}"></td><td th:text="${line.quantity}"></td><td th:text="${#numbers.formatDecimal(line.unitPrice,1,'POINT',0,'COMMA')+' đ'}"></td><td th:text="${#numbers.formatDecimal(line.lineTotal,1,'POINT',0,'COMMA')+' đ'}"></td></tr></tbody></table></div><p class="fs-5">Tổng đơn: <b th:text="${#numbers.formatDecimal(order.totalAmount,1,'POINT',0,'COMMA')+' đ'}"></b></p>
<h2 class="h5">Lịch sử trạng thái</h2><ul><li th:each="event : ${order.history}"><time th:text="${#temporals.format(event.changedAt,'dd/MM/yyyy HH:mm:ss')}"></time> · <span th:replace="~{storefront/orders/fragments :: status(${event.toStatus})}"></span> · <span th:text="${event.actor}"></span><span th:if="${event.note}" th:text="${' — '+event.note}"></span></li></ul></section>
<aside class="col-lg-4"><div class="card card-body"><h2 class="h5">Nhận hàng</h2><p>Chi nhánh: <b th:text="${order.branchName}"></b></p><p th:text="${order.deliveryType.name()=='PICKUP'?'Nhận tại cửa hàng':'Giao tận nơi'}"></p><p th:text="${order.receiverName+' · '+order.receiverPhone}"></p><p th:text="${order.deliveryAddress}"></p><p th:if="${order.note}" th:text="${order.note}"></p>
<p>Thanh toán: <span th:text="${order.paymentMethod.name()=='ONLINE'?'Online mô phỏng':(order.paymentMethod.name()=='COD'?'COD':'Tại cửa hàng')}"></span></p><p th:if="${order.paymentStatus!=null}" th:text="${order.paymentStatus=='PAID'?'Đã thu tiền mô phỏng':'Đã hoàn tiền mô phỏng'}"></p><p th:if="${order.paymentStatus!=null}" th:text="${#numbers.formatDecimal(order.paidAmount,1,'POINT',0,'COMMA')+' đ'}"></p>
<a class="btn btn-primary mb-3" th:if="${order.status.name()=='PENDING_PAYMENT'}" th:href="@{/checkout/pay/{code}(code=${order.code})}">Thanh toán online mô phỏng</a>
<form th:if="${order.status.name()=='PENDING_PAYMENT'||order.status.name()=='PLACED'}" th:action="@{/orders/{code}/cancel(code=${order.code})}" method="post" data-lock-submit><label for="reason" class="form-label">Lý do hủy (tùy chọn)</label><textarea name="reason" id="reason" class="form-control mb-2" maxlength="255"></textarea><button class="btn btn-outline-danger" type="submit">Hủy đơn và nhả hàng</button></form><p class="text-secondary" th:if="${order.cancelledReason}" th:text="${order.cancelledReason}"></p></div></aside></div><a class="btn btn-outline-secondary" th:href="@{/account/orders}">Đơn hàng của tôi</a></main><footer th:replace="~{fragments/storefront :: footer}"></footer><script th:src="@{/js/orders.js}" defer></script></body></html>
