<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/storefront :: head('Đơn hàng của tôi')}"></head><body class="storefront-body"><nav th:replace="~{fragments/storefront :: nav}"></nav><main class="container py-4"><div th:replace="~{fragments/layout :: messages}"></div><h1 class="h3">Đơn hàng của tôi</h1><form th:action="@{/account/orders}" method="get" class="d-flex gap-2 mb-3"><label for="orderStatusFilter" class="form-label align-self-center text-nowrap">Trạng thái</label><select id="orderStatusFilter" name="status" class="form-select"><option value="">Tất cả trạng thái</option><option th:each="s : ${T(com.dienmay.orders.entity.OrderStatus).values()}" th:value="${s}" th:selected="${s==status}" th:text="${s.label}"></option></select><button class="btn btn-primary" type="submit">Lọc</button></form><p th:if="${orders.empty}">Chưa có đơn hàng.</p><div class="table-responsive"><table class="table"><thead><tr><th>Mã đơn</th><th>Ngày đặt</th><th>Chi nhánh</th><th>Trạng thái</th><th>Tổng</th></tr></thead><tbody><tr th:each="order : ${orders}"><td><a th:href="@{/orders/{code}(code=${order.code})}" th:text="${order.code}"></a></td><td th:text="${#temporals.format(order.createdAt,'dd/MM/yyyy HH:mm')}"></td><td th:text="${order.branchName}"></td><td><span th:replace="~{storefront/orders/fragments :: status(${order.status})}"></span></td><td th:text="${#numbers.formatDecimal(order.totalAmount,1,'POINT',0,'COMMA')+' đ'}"></td></tr></tbody></table></div><nav class="d-flex gap-3" th:if="${result.totalPages>1}"><a th:if="${result.hasPrevious()}" th:href="@{/account/orders(page=${result.number-1},status=${status})}">Trước</a><span th:text="${'Trang '+(result.number+1)+' / '+result.totalPages}"></span><a th:if="${result.hasNext()}" th:href="@{/account/orders(page=${result.number+1},status=${status})}">Sau</a></nav></main><footer th:replace="~{fragments/storefront :: footer}"></footer><script th:src="@{/js/orders.js}" defer></script></body></html>
