<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/storefront :: head('Cổng thanh toán mô phỏng')}"></head><body class="storefront-body"><nav th:replace="~{fragments/storefront :: nav}"></nav><main class="container py-4"><div th:replace="~{fragments/layout :: messages}"></div><section class="card card-body form-width-medium mx-auto"><h1 class="h3">Cổng thanh toán mô phỏng</h1><p class="alert alert-warning">Đây là giả lập phục vụ đồ án. Không nhập số thẻ và không chuyển tiền thật.</p><p>Đơn: <strong th:text="${order.code}"></strong></p><p>Số tiền: <b th:text="${#numbers.formatDecimal(order.totalAmount,1,'POINT',0,'COMMA')+' đ'}"></b></p><p th:if="${order.expiresAt}">Hạn: <time th:text="${#temporals.format(order.expiresAt,'dd/MM/yyyy HH:mm:ss')}"></time> (giờ Việt Nam). <strong data-countdown th:attr="data-expires-millis=${expiresMillis}"></strong></p><th:block th:if="${order.status.name()=='PENDING_PAYMENT'}"><form th:action="@{/checkout/pay/{code}(code=${order.code})}" method="post" data-lock-submit><button class="btn btn-success w-100 mb-3" type="submit" data-pay-button>Thanh toán thành công</button></form><form th:action="@{/orders/{code}/cancel(code=${order.code})}" method="post" data-lock-submit><input type="hidden" name="reason" value="Khách hủy thanh toán mô phỏng"><button class="btn btn-outline-danger w-100" type="submit">Hủy thanh toán</button></form></th:block><p th:unless="${order.status.name()=='PENDING_PAYMENT'}">Đơn không còn chờ thanh toán.</p><a class="mt-3" th:href="@{/orders/{code}(code=${order.code})}">Về chi tiết đơn</a></section></main><footer th:replace="~{fragments/storefront :: footer}"></footer><script th:src="@{/js/orders.js}" defer></script></body></html>
