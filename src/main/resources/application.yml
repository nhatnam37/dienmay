spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  application:
    name: dienmay
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      # Flyway quản lý schema, Hibernate không tự tạo/sửa bảng.
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  upload-dir: ${UPLOAD_DIR:./uploads}

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
