spring:
  application:
    name: dienmay
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      # Flyway quản lý schema, Hibernate không tự tạo/sửa bảng.
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
